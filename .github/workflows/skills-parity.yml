name: Skills parity

# Repo-local *published* skills (canonical under plugins/bffless-apps/skills/,
# e.g. handoff-api) and *authored* skills (repo-private, canonical under
# .claude/skills/, e.g. install-app) are mirrored into .claude/skills/ and/or
# .agents/skills/ as real, byte-identical files, so a fork gets them in
# whichever harness layout it uses. This check fails a PR if any mirror copy
# drifts from its canonical source — run `pnpm skills:sync` (or
# `node scripts/sync-skills.mjs`) and commit the result to fix.
on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.agents/skills/**'
      - 'plugins/**'
      - 'scripts/sync-skills.mjs'
      - 'skills-lock.json'
      - '.github/workflows/skills-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check published + authored skill copies are in sync
        run: node scripts/sync-skills.mjs --check
