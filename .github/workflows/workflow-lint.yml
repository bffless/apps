name: workflow-lint

# Builds and tests @bffless/workflow-lint (the M0 `workflow lint` prototype) and
# runs the built CLI over the spec's two example workflows, so the linter, the
# schema copy (drift-fenced by a test) and the examples can never diverge
# silently. See apps/workflow/docs/spec/00-overview.md (M0) and
# packages/workflow-lint/README.md.

on:
  pull_request:
    paths:
      - 'packages/workflow-lint/**'
      - 'apps/workflow/docs/spec/workflow.schema.json'
      - 'apps/workflow/docs/spec/examples/**'
      - '.github/workflows/workflow-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @bffless/workflow-lint build

      - name: Lint (eslint)
        run: pnpm --filter @bffless/workflow-lint lint

      - name: Test
        run: pnpm --filter @bffless/workflow-lint test:run

      # hello/interactive aren't checked against a real rule set here: they now
      # live in bffless/workflow-implementations (M3 Task 7 moved hello out to
      # bffless/workflow-hello; M4 folded it into the implementations monorepo)
      # — that repo's own CI lints them against it (this repo only mirrors the
      # two YAMLs for drift-checking, see apps/workflow/src/hello-drift.test.ts).
      # `--alias` a name nothing under this repo's own
      # apps/workflow/.bffless/proxy-rules matches, so `rule-missing` degrades
      # to a notice instead of silently resolving to this repo's own `workflow`
      # set — with hello's set gone there is exactly one set left here, so an
      # unscoped search is no longer ambiguous and would otherwise "find" the
      # wrong one.
      #
      # studio.workflow.yaml moved with its implementation to
      # bffless/workflow-implementations (M4) — its clean-lint check against
      # the real rule set runs in that repo's CI and again inside
      # `bffless/publish-workflow@v1` at deploy time. The linter-side
      # equivalents here run against vendored fixtures in
      # packages/workflow-lint/test/cli.test.ts.
      - name: Lint the spec examples with the built CLI
        run: |
          node packages/workflow-lint/dist/cli.js lint --alias hello apps/workflow/docs/spec/examples/hello.workflow.yaml apps/workflow/docs/spec/examples/interactive.workflow.yaml
