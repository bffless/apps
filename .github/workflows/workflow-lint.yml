name: workflow-lint

# Builds and tests @bffless/workflow-lint (the M0 `workflow lint` prototype) and
# runs the built CLI over the spec's two example workflows, so the linter, the
# schema copy (drift-fenced by a test) and the examples can never diverge
# silently. See apps/workflow/docs/spec/00-overview.md (M0) and
# packages/workflow-lint/README.md.

on:
  pull_request:
    paths:
      - 'packages/workflow-lint/**'
      - 'apps/workflow/docs/spec/workflow.schema.json'
      - 'apps/workflow/docs/spec/examples/**'
      - 'apps/workflow-studio/.bffless/workflows/**'
      - 'apps/workflow-studio/.bffless/proxy-rules/**'
      - '.github/workflows/workflow-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @bffless/workflow-lint build

      - name: Lint (eslint)
        run: pnpm --filter @bffless/workflow-lint lint

      - name: Test
        run: pnpm --filter @bffless/workflow-lint test:run

      # hello/interactive aren't checked against a real rule set here: they now
      # live in bffless/workflow-hello (M3 Task 7) — that repo's own CI lints
      # them against it (this repo only mirrors the two YAMLs for
      # drift-checking, see apps/workflow/src/hello-drift.test.ts). `--alias`
      # a name nothing under this repo's own apps/workflow/.bffless/proxy-rules
      # matches, so `rule-missing` degrades to a notice instead of silently
      # resolving to this repo's own `workflow` set — with hello's set gone
      # there is exactly one set left here, so an unscoped search is no longer
      # ambiguous and would otherwise "find" the wrong one.
      #
      # studio.workflow.yaml is no longer a spec example — it ships with its
      # implementation (apps/workflow-studio) and is checked against that
      # app's own (real, on-disk) rule set with --rules/--path-prefix, which is
      # now complete, so this is a clean lint. The same check runs again inside
      # the app's own stager (apps/workflow-studio/scripts/stage.mjs) and a
      # third time inside `bffless/publish-workflow@v1` at deploy time; it is
      # here so a change to the LINTER cannot silently break the workflow.
      - name: Lint the spec examples and the Studio workflow with the built CLI
        run: |
          node packages/workflow-lint/dist/cli.js lint --alias hello apps/workflow/docs/spec/examples/hello.workflow.yaml apps/workflow/docs/spec/examples/interactive.workflow.yaml
          node packages/workflow-lint/dist/cli.js lint apps/workflow-studio/.bffless/workflows/studio.workflow.yaml --rules apps/workflow-studio/.bffless/proxy-rules/workflow-studio --path-prefix /api/workflow-studio
