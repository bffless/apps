name: workflow-app
on:
  pull_request:
    paths:
      [
        'apps/workflow/**',
        'packages/workflow-lint/**',
        'packages/workflow-script/**',
        'packages/workflow-headless/**',
        'packages/workflow-live/**',
        '.github/workflows/workflow-app.yml',
      ]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bffless/workflow-lint build
      - run: pnpm --filter workflow lint
      # Both the MSW mock's island route and the Playwright smoke read
      # `hello-dist/islands/*.html`, so the bundle is staged before either runs.
      # Keep this order in step with deploy-workflow.yml (stage → build → test).
      # `stage` clones `bffless/workflow-hello` at the pin in `hello.ref` and
      # runs its own `pnpm build` (M3 Task 7) — this step needs network.
      - run: pnpm --filter workflow stage
      # No VITE_BFFLESS_PROJECT here, deliberately: CI/mocks/tests exercise the
      # unscoped discovery path (every alias the mock project's fixtures ship),
      # not the deploy's `bffless/workflow`-scoped one (apps#363).
      - run: pnpm --filter workflow build
      # The driver CLI (M3 Task 14). Its unit suite mocks Playwright behind a
      # PageLike seam, so it launches no browser and needs no harness — but
      # `e2e/headless.spec.ts` (Task 15) spawns the built `dist/cli.js` against
      # the Playwright webServer, so this build must precede the e2e step. The
      # spec fails loudly, never skips, when the build is missing.
      - run: pnpm --filter @bffless/workflow-headless build
      - run: pnpm --filter @bffless/workflow-headless lint
      - run: pnpm --filter @bffless/workflow-headless test:run
      - run: pnpm --filter @bffless/workflow-live build
      - run: pnpm --filter @bffless/workflow-live lint
      - run: pnpm --filter @bffless/workflow-live test:run
      - run: pnpm --filter workflow test:run
      # The stager suite (a real clone + build of workflow-hello) is its own step, not part of test:run.
      - run: pnpm --filter workflow test:stage
      # One Chromium serves both browsers here: Playwright's own worker and the
      # driver's (`playwright` and `@playwright/test` are pinned to the same
      # version, so they resolve the same browser revision out of the shared
      # ~/.cache/ms-playwright).
      - name: Install Playwright Chromium
        run: pnpm --filter workflow exec playwright install chromium --with-deps
      # hello.spec, interactive.spec — and headless.spec, which is the headless
      # smoke: the real CLI, the real harness page, artifacts read back off disk.
      - name: Playwright smoke
        run: pnpm --filter workflow test:e2e
