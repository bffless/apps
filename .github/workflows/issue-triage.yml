name: Issue Triage

# Runs the `apps-triage` agent (.claude/agents/apps-triage.md) headlessly against one
# issue. The agent reads the issue, resolves what it can from the source, applies the
# category / app / readiness labels and leaves a `## Triage` comment — the brief that
# `apps-implement` later consumes. The agent definition and
# .claude/apps-pr-review-checklist.md are read from this checkout on every run, so
# changing what triage looks for is a doc edit, not a workflow edit.
#
# Triggers:
#   - a new issue is opened
#   - a human adds the `needs-triage` label (re-run after the reporter answers)
#   - workflow_dispatch with an issue number
# Label/comment writes made with GITHUB_TOKEN do not fire `issues` events, so the
# agent cannot retrigger itself.

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to triage'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

# A re-run supersedes an in-flight triage of the same issue. Only a run that will
# actually triage may do the superseding: `concurrency` is settled before the job's
# `if`, so an issue filed WITH labels — which fires `opened` and `labeled` together —
# had its `labeled` run (skipped below, the label is not `needs-triage`) cancel the
# `opened` run, and the issue was never triaged (#490, #491). A no-op event lands in
# its own group and cancels nothing.
concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue }}-${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.label.name == 'needs-triage') && 'triage' || 'noop' }}
  cancel-in-progress: true

jobs:
  triage:
    name: Agent triage
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'opened' ||
      github.event.label.name == 'needs-triage'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # `issues` events always run from the default branch, so the agent's
          # instructions come from main — issue text is data, never instructions.
          # Full history: the agent uses `git log --grep "#<n>"` to spot merged fixes.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run triage agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          if [ ! -f .claude/agents/apps-triage.md ]; then
            echo "apps-triage is not on main yet — skipping."
            exit 0
          fi
          # The agent applies labels and comments itself via gh; the allowlist below is
          # the only write surface it has. Everything else is read-only.
          claude -p "Triage issue #${ISSUE} in this repository (bffless/apps). Apply the labels and leave the triage comment as your instructions describe, then output only your report as GitHub-flavoured markdown." --agent apps-triage --model claude-opus-5 --output-format text --allowedTools "Read" "Grep" "Glob" "Agent" "Bash(gh issue view:*)" "Bash(gh issue list:*)" "Bash(gh issue edit:*)" "Bash(gh issue comment:*)" "Bash(gh pr list:*)" "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh label list:*)" "Bash(git fetch:*)" "Bash(git show:*)" "Bash(git log:*)" "Bash(git ls-tree:*)" "Bash(git diff:*)" "Bash(git rev-parse:*)" "Bash(git grep:*)" > triage-report.md
          echo "--- triage report ---"
          cat triage-report.md
          {
            printf '## Triage report — issue #%s\n\n' "$ISSUE"
            cat triage-report.md
          } >> "$GITHUB_STEP_SUMMARY"
