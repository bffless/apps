name: publish-workflow-lint

# Publishes the public Workflow toolchain packages to npm:
#
#   @bffless/workflow-lint      the `workflow` CLI (lint + index) an implementation
#                               repo runs over npx in its own CI
#   @bffless/workflow-script    the types-only `script` step contract
#   @bffless/workflow-headless  the Playwright driver CLI that runs a harness
#                               workflow unattended
#
# (The file keeps its workflow-lint name because release.yml calls it by path; it
# has published more than that package since the second one joined.)
#
# Called by release.yml's `publish-packages` job — one leg per packages/* component
# release-please just released, carrying that component's npm name and the tag it
# cut.
#
# There is deliberately NO `push: tags:` trigger. Release-please creates the tags
# with the default GITHUB_TOKEN, and GitHub does not raise `push` events for refs
# created with it: "events triggered by the GITHUB_TOKEN will not create a new
# workflow run" (docs: actions/using-workflows/triggering-a-workflow). A tag trigger
# here can therefore never fire — which is exactly what happened on 2026-08-27:
# workflow-lint-v1.0.0 and workflow-script-v1.0.0 were tagged, no run appeared, and
# nothing reached npm. Driving the publish from inside the release run is the fix.
#
# Release-please still owns the versions and the tags. Nothing here bumps a version,
# and the guard below refuses to publish when the checked-out package.json disagrees
# with the tag being published.

on:
  workflow_call:
    inputs:
      package:
        description: 'npm package name, e.g. @bffless/workflow-lint'
        required: true
        type: string
      ref:
        description: 'the release tag to check out and publish, e.g. workflow-lint-v1.0.0'
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

  # Recovery / manual publish. Dispatch from main and name the tag: the checkout
  # below uses `ref`, not the dispatch ref, so what gets published is always the
  # tagged tree — the same bytes the workflow_call path would publish.
  workflow_dispatch:
    inputs:
      package:
        description: 'npm package to publish'
        required: true
        type: choice
        options:
          - '@bffless/workflow-lint'
          - '@bffless/workflow-script'
          - '@bffless/workflow-headless'
      ref:
        description: 'the release tag to check out and publish, e.g. workflow-lint-v1.0.0'
        required: true
        type: string

permissions:
  contents: read

# One publish at a time per package — npm rejects a duplicate version, and a failed
# race is indistinguishable from a real failure in the log. Scoped by package rather
# than shared across both: GitHub keeps at most ONE pending run per concurrency group
# and cancels any older pending one, so a single shared group would silently drop a
# leg the moment a third package joins the release.
concurrency:
  group: publish-workflow-packages-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag is `<component>-v<version>`, so the checked-out package.json version
      # has to equal what is left after stripping that prefix. A mismatch means the
      # ref and the tree disagree — a mis-typed dispatch, a hand-moved tag, or a
      # release.yml mapping bug — and npm is the one copy nobody can take back.
      #
      # This also re-derives the npm name from package.json and cross-checks it
      # against the input: release.yml builds the name by convention
      # (packages/<name> -> @bffless/<name>), and this is where that convention is
      # actually verified rather than assumed.
      - name: Verify the checked-out package matches the tag
        id: verify
        env:
          PKG: ${{ inputs.package }}
          REF: ${{ inputs.ref }}
        run: |
          case "$PKG" in
            @bffless/workflow-lint)     DIR=packages/workflow-lint ;;
            @bffless/workflow-script)   DIR=packages/workflow-script ;;
            @bffless/workflow-headless) DIR=packages/workflow-headless ;;
            *) echo "::error::unknown package $PKG"; exit 1 ;;
          esac
          COMPONENT="${DIR#packages/}"
          case "$REF" in
            "$COMPONENT-v"*) ;;
            *) echo "::error::ref $REF is not a $COMPONENT release tag"; exit 1 ;;
          esac
          TAG_VERSION="${REF#"$COMPONENT-v"}"
          PKG_NAME="$(jq -r .name "$DIR/package.json")"
          PKG_VERSION="$(jq -r .version "$DIR/package.json")"
          if [ "$PKG_NAME" != "$PKG" ]; then
            echo "::error::$DIR/package.json is named $PKG_NAME but this run was asked to publish $PKG"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::$PKG_NAME at $REF is version $PKG_VERSION but the tag says $TAG_VERSION"
            exit 1
          fi
          echo "publishing $PKG_NAME@$PKG_VERSION from $REF"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # A package that ships built output (`files: ["dist", …]`) with its bin at
      # dist/cli.js is an empty tarball without this — workflow-lint and
      # workflow-headless both are. workflow-script is a single hand-written .d.ts
      # with nothing to build.
      #
      # The gate asks the checked-out package.json whether it *has* a build script
      # rather than naming the packages that do. An `if:` expression cannot read a
      # file, so the decision lives in the shell — and that is the point: a fourth
      # package joins by existing, not by remembering to widen an equality here.
      # Forgetting this is how a bin package reaches npm with no dist/ in it.
      - name: Build
        env:
          PKG: ${{ inputs.package }}
          DIR: ${{ steps.verify.outputs.dir }}
        run: |
          if jq -e '.scripts.build // empty' "$DIR/package.json" > /dev/null; then
            pnpm --filter "$PKG" build
          else
            echo "$PKG declares no build script — nothing to build"
          fi

      # The tag is already cut, so this cannot stop a bad release — but it does stop
      # a bad release reaching npm, which is the copy nobody can take back. Same
      # ask-the-package rule as Build above.
      - name: Test
        env:
          PKG: ${{ inputs.package }}
          DIR: ${{ steps.verify.outputs.dir }}
        run: |
          if jq -e '.scripts["test:run"] // empty' "$DIR/package.json" > /dev/null; then
            pnpm --filter "$PKG" test:run
          else
            echo "$PKG declares no test:run script — nothing to test"
          fi

      # --no-git-checks: the checkout is a detached tag, which pnpm otherwise refuses.
      - name: Publish to npm
        env:
          PKG: ${{ inputs.package }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter "$PKG" publish --access public --no-git-checks
