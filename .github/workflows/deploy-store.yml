name: Store — build + deploy apps.bffless.dev

# Rebuilds the composite store artifact (site + registry.json + assets — see
# scripts/build-store-artifact.mjs) when store/metadata sources change, and deploys it on
# main. app-bundles.yml publishes the same artifact after an app release; the shared
# `app-bundles` concurrency group serializes the two so they can't race on the alias.
#
# On pull_request this builds (and smoke-asserts) the same artifact and deploys it to a
# per-PR preview alias (store-pr-<N>) on the registry instance — never to app-registry.
# The preview registry.json is built from the PR's manifests/catalog but only apps with a
# PUBLISHED release get entries, same as production. cleanup-preview-store.yml deletes the
# alias when the PR closes.

on:
  push:
    branches: [main]
    paths:
      - 'store/**'
      - 'apps/*/catalog/**'
      - 'apps/*/bffless-app.json'
      - 'scripts/build-registry.mjs'
      - 'scripts/build-store-artifact.mjs'
      - 'scripts/fetch-sidecars.mjs'
      - '.github/workflows/deploy-store.yml'
  pull_request:
    paths:
      - 'store/**'
      - 'apps/*/catalog/**'
      - 'apps/*/bffless-app.json'
      - 'scripts/build-registry.mjs'
      - 'scripts/build-store-artifact.mjs'
      - 'scripts/fetch-sidecars.mjs'
      - '.github/workflows/deploy-store.yml'
  # Manual republish. The push trigger above is path-filtered, so there is
  # otherwise no way to rebuild registry.json without touching one of those
  # paths — which matters when the registry is stale for a reason that has
  # nothing to do with a file changing (an app release published after the
  # last store build, or a publish whose bytes did not land).
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'push' && 'app-bundles' || format('store-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Script tests
        run: pnpm scripts:test

      - name: Fetch published sha256 sidecars
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-sidecars.mjs --sidecars dist-bundles

      - name: Build store artifact (site + registry.json + assets)
        run: node scripts/build-store-artifact.mjs --sidecars dist-bundles --out registry-staging

      - name: Deploy to apps.bffless.dev
        if: github.event_name == 'push'
        uses: bffless/upload-artifact@v1
        with:
          path: registry-staging
          api-url: ${{ vars.BFFLESS_REGISTRY_URL }}
          api-key: ${{ secrets.BFFLESS_REGISTRY_API_KEY }}
          alias: app-registry
          description: 'App store + catalog registry'

      # PR preview on the same instance, own alias — the pr-comment carries the preview
      # URLs. The composite's paths live under registry-staging/ (see the artifact-dir
      # comment in scripts/build-store-artifact.mjs), which matches the base-path the
      # action derives from `path`, so preview links resolve the same way production does.
      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: bffless/upload-artifact@v1
        with:
          path: registry-staging
          api-url: ${{ vars.BFFLESS_REGISTRY_URL }}
          api-key: ${{ secrets.BFFLESS_REGISTRY_API_KEY }}
          alias: store-pr-${{ github.event.pull_request.number }}
          description: 'Store preview for PR #${{ github.event.pull_request.number }}'
          summary-title: Store Preview
          pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
