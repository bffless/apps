name: Deploy Workflow Studio implementation to BFFless

# Publishes apps/workflow-studio to the harness project as the `workflow-studio`
# implementation: lint + index the workflow, sync the rule set under
# /api/workflow-studio/ (with the generated /w/workflow-studio/* forwarder), upload the
# bundle to the alias and attach the set to the harness alias — all of it inside
# `bffless/publish-workflow@v1`. See apps/workflow/docs/writing-an-implementation.md and
# apps/workflow-studio/bffless/README.md.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['apps/workflow-studio/**']

concurrency: { group: deploy-workflow-studio, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The stager's last step is this package's `workflow` bin.
      - run: pnpm --filter @bffless/workflow-lint build

      # Type-check, build the island and the five script modules, and write
      # dist/.bffless/workflows/index.json. Same order as workflow-studio.yml, so what is
      # deployed here is what CI tested.
      - run: pnpm --filter workflow-studio stage

      # No `target-url`: since v1.2.0 the harness forwards /w/workflow-studio/* to this
      # alias IN-PROCESS on the CE backend, so the implementation needs no domain of its
      # own (apps/workflow-studio/bffless/README.md → "Domain is OPTIONAL"). The action
      # re-runs `workflow index` over the same `path`, which rewrites the index.json the
      # stage step wrote — with the commit SHA filled in.
      - uses: bffless/publish-workflow@v1
        with:
          alias: workflow-studio
          name: Studio
          # Kept in step with `DESCRIPTION` in apps/workflow-studio/scripts/stage.mjs by
          # hand — nothing enforces it. THIS value is the one that ships: the action re-runs
          # `workflow index` over the staged bundle and overwrites the stager's.
          description: 'The reference port of Studio: long screen recordings become a cut-first short in your own recorded voice, plus a companion blog post and a cover image.'
          repository: bffless/workflow
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_WORKFLOW_API_KEY }}
          path: apps/workflow-studio/dist
          workflows: apps/workflow-studio/.bffless/workflows
          rules: apps/workflow-studio/.bffless/proxy-rules/workflow-studio

      # A green publish doesn't prove the right bundle was published — assert it
      # (needs @bffless/workflow-lint >= 1.0.1; the same guard hello's deploy.yml carries).
      - name: Assert the published bundle's impl matches the alias
        env:
          EXPECTED_IMPL: workflow-studio
        run: |
          node -e "
            const fs = require('node:fs');
            const idx = JSON.parse(fs.readFileSync('apps/workflow-studio/dist/.bffless/workflows/index.json', 'utf8'));
            const expected = process.env.EXPECTED_IMPL;
            if (idx.impl !== expected) {
              console.error('::error::published bundle impl ' + JSON.stringify(idx.impl) + ' != alias ' + JSON.stringify(expected));
              process.exit(1);
            }
          "
