name: Release

# The single owner of app versioning and of the app-registry alias.
#
#   release          release-please keeps the Release PR current; merging that PR
#                    bumps versions and cuts one tag + GitHub Release per app
#   bundles          builds each released app's bundle, attached to its release
#   publish-registry full snapshot of every app -> registry.json + site + assets
#
# publish-registry is chained with `needs` rather than triggered by an event because
# the registry omits any app whose release has no bundle asset yet: it must not run
# until every bundle is attached. Expressed as needs that is a guarantee; expressed
# as cross-workflow events it is a race — which is the class of bug that produced
# the 2026-08-02 stale registry. See
# docs/superpowers/specs/2026-08-02-app-release-please-design.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serializes runs so two merges landing inside one release's ~90s window cannot race on the
# app-registry alias — an older run's upload finishing last would point the alias at the
# older deployment, a stale registry by a different route than the 2026-08-02 incident.
# cancel-in-progress stays false deliberately: cancelling a run mid-release could leave a
# tag cut with no bundle asset attached.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      apps_released: ${{ steps.apps.outputs.apps_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please-action's `paths_released` output is a JSON array of package paths
      # ("apps/reader"); app-bundles.yml's `app` input wants the bare id ("reader"). Strip
      # the prefix here, in plain shell, rather than in a reusable-workflow `with:`
      # expression — those accept only a restricted expression set, and a round-trip
      # through fromJSON/format there would not actually strip the prefix.
      #
      # Only apps/* survives the filter: release-please also owns the publishable
      # packages/* components (workflow-lint, workflow-script), and those have no
      # catalog bundle — an unfiltered list would hand app-bundles.yml a path that
      # is not an app id and fail the release on a package-only release.
      - name: Map released paths to bare app ids
        id: apps
        run: |
          echo '${{ steps.release.outputs.paths_released || '[]' }}' \
            | jq -c '[.[] | select(startswith("apps/")) | sub("^apps/"; "")]' \
            > /tmp/apps_released.json
          echo "apps_released=$(cat /tmp/apps_released.json)" >> "$GITHUB_OUTPUT"

  # One leg per app release-please just released.
  bundles:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    strategy:
      # One app's bundle failure must not cancel another app's leg that would have
      # succeeded — recovery for a genuine failure is then one dispatch, not two.
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.release.outputs.apps_released) }}
    uses: ./.github/workflows/app-bundles.yml
    with:
      app: ${{ matrix.app }}
    # No secrets: inherit — app-bundles.yml touches no repository secret (only
    # github.token, passed to called workflows regardless of this line). This job must
    # not carry BFFLESS_REGISTRY_API_KEY: it never publishes the registry, and it is
    # workflow_dispatch-able on its own.

  publish-registry:
    needs: [release, bundles]
    # !cancelled() so this still runs when `bundles` was skipped (a push with no
    # release); the result guards then reject a genuine bundle failure, which must not
    # publish a registry that would omit the app whose bundle failed. always() would
    # also be true for a cancelled run, which is not the intent here.
    if: |
      !cancelled()
      && needs.release.result == 'success'
      && (needs.bundles.result == 'success' || needs.bundles.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # release-please's release commit touches apps/*/bffless-app.json, so a release
      # always satisfies this; the path list additionally catches store/catalog edits
      # that change the registry or the site without any release.
      #
      # The diff must cover the whole push, not just its last commit: a push can land
      # several commits at once (e.g. a merge commit), and store/catalog changes in the
      # earlier ones would otherwise be invisible. github.event.before is the SHA the
      # branch pointed at before this push, so diffing before->after covers the full
      # range; fetch-depth: 0 above ensures that range is present locally. `before` is
      # unusable on a workflow_dispatch run (no push event) or when it reports the
      # all-zeros SHA (first push to the branch) — in both cases the range is
      # indeterminate, and this defaults to publishing rather than risk a silently stale
      # registry: an unneeded publish costs ~90s, a wrongly-skipped one leaves nothing to
      # signal the miss. (Force-push to `main` is blocked by the require-pr ruleset, so
      # it is not a case this needs to guard against.)
      - name: Decide whether to publish
        id: decide
        run: |
          if [ "${{ needs.release.outputs.releases_created }}" = "true" ] \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"   # range indeterminate — publish rather than risk staleness
            exit 0
          fi
          # A base SHA that doesn't resolve locally (fetch depth too shallow, or some other
          # reason git can't see it) makes the range indeterminate the same way a missing/zero
          # `before` does: default to publish rather than let `|| true` swallow the failure and
          # silently read as "nothing changed". Not a force-push guard — force-push to `main` is
          # blocked by the require-pr ruleset.
          if ! git rev-parse --verify --quiet "$BEFORE^{commit}" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"   # base commit not resolvable — range indeterminate, publish rather than risk staleness
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if echo "$CHANGED" | grep -qE '^(store/|apps/[^/]+/catalog/|apps/[^/]+/bffless-app\.json|scripts/(build-registry|build-store-artifact|fetch-sidecars)\.mjs)'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.decide.outputs.publish == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.decide.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        if: steps.decide.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Script tests
        if: steps.decide.outputs.publish == 'true'
        run: pnpm scripts:test

      # Best effort: an app whose declared version has no published release is omitted
      # with a ::warning, not an error.
      - name: Fetch published sha256 sidecars
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-sidecars.mjs --sidecars dist-bundles

      # One composite artifact — site, registry.json and assets together, so a registry
      # entry can never reference an asset that has not been uploaded. The output dir
      # name must stay registry-staging: upload-artifact prefixes zip entries with it and
      # CE matches those publicPaths against the domain mapping's /registry-staging.
      - name: Build store artifact (site + registry.json + assets)
        if: steps.decide.outputs.publish == 'true'
        run: node scripts/build-store-artifact.mjs --sidecars dist-bundles --out registry-staging

      - name: Publish store + registry to BFFless
        if: steps.decide.outputs.publish == 'true'
        uses: bffless/upload-artifact@v1
        with:
          path: registry-staging
          api-url: ${{ vars.BFFLESS_REGISTRY_URL }}
          api-key: ${{ secrets.BFFLESS_REGISTRY_API_KEY }}
          alias: app-registry
          description: 'App store + catalog registry'
