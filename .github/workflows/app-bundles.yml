name: App bundles — build + publish

# Builds an app-catalog install bundle (scripts/build-app-bundle.mjs) for ONE app and
# publishes it as a GitHub release asset. It does NOT publish the registry — that is
# release.yml's publish-registry job, which is the single publisher of the app-registry
# alias. Two publishers writing the same commit-scoped storage key is what made the
# registry go stale on 2026-08-02; see
# docs/superpowers/specs/2026-08-02-app-release-please-design.md.
#
# Two entry points, both supplying `app`:
#   - workflow_call from release.yml, once per app release-please just released
#   - workflow_dispatch, to rebuild one app's bundle by hand against its existing tag
#     (the release step re-uploads with --clobber)
on:
  workflow_call:
    inputs:
      app:
        description: 'App id to build and publish (matches apps/<app>/bffless-app.json)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      app:
        description: 'App id to build and publish (matches apps/<app>/bffless-app.json)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve app id
        id: app
        env:
          APP: ${{ inputs.app }}
        run: |
          if [ ! -f "apps/$APP/bffless-app.json" ]; then
            echo "::error::apps/$APP/bffless-app.json not found — no manifest to build a bundle from" >&2
            exit 1
          fi
          echo "id=$APP" >> "$GITHUB_OUTPUT"

      - name: Build bundle
        run: node scripts/build-app-bundle.mjs "${{ steps.app.outputs.id }}"

      - name: Resolve version + release tag
        id: release
        run: |
          VERSION=$(node -p "require('./apps/${{ steps.app.outputs.id }}/bffless-app.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${{ steps.app.outputs.id }}-v$VERSION" >> "$GITHUB_OUTPUT"

      # Create the release on first publish of this app+version, or re-upload (--clobber) the
      # assets on a manual re-run against an existing tag (e.g. a registry-only fix).
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          # nullglob so an absent .commit sidecar (build-app-bundle.mjs omits it when the commit
          # is unresolvable) drops out of the list instead of reaching gh as a literal glob.
          shopt -s nullglob
          ASSETS=(dist-bundles/*.zip dist-bundles/*.sha256 dist-bundles/*.commit)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --title "$TAG" --notes "App-catalog bundle for ${{ steps.app.outputs.id }} v${{ steps.release.outputs.version }}."
          fi
