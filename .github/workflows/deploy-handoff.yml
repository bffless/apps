name: Deploy Handoff to BFFless

# One workflow per app: pushes that touch apps/handoff (or this file) deploy Handoff,
# and it can always be run by hand. Clone the monorepo, set BFFLESS_URL +
# BFFLESS_API_KEY on your fork, and deploy just this app.
#
# Deploys happen on a merge to main AND on pushes to a `bapps-**` working branch
# (so you can see the app live before merge), plus ad-hoc via workflow_dispatch
# (Actions tab → Run workflow → pick any branch). All target the `handoff` alias.
on:
  push:
    branches: [main, 'bapps-**']
    paths:
      - 'apps/handoff/**'
      - '.github/workflows/deploy-handoff.yml'
  workflow_dispatch:

concurrency:
  group: deploy-handoff
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter handoff build

      - name: Run unit tests
        run: pnpm --filter handoff test:run

      # The rule handlers are .fn.ts, but the rule compiler bundles them with esbuild, which only
      # STRIPS types — it never checks them. Without this step a genuine type error would sail
      # through the sync and into production. Runs before the sync, so it can stop it.
      - name: Typecheck proxy-rule handlers
        run: pnpm --filter handoff typecheck:rules

      # Sync BEFORE the upload, so the build never goes live against rules that
      # don't exist yet. Requires CE >= 0.2.0 on the instance.
      #
      # Deliberately NOT `bffless/deploy-proxy-rules@v1` here, unlike deploy-reader/deploy-studio:
      # that action ncc-bundles `bffless@^0.1.0`, whose compiler predates .fn.ts handlers and
      # rejects Handoff's rules outright ("code must be a relative path ending in .js"). Handoff
      # authors its handlers in TypeScript, which needs bffless >= 0.2.0, so we invoke the CLI
      # directly — same approach the drift-check workflow already takes. Once the action ships a
      # 0.2.x-based release (bffless/deploy-proxy-rules#2), this can go back to `uses:`.
      - name: Sync proxy rules to BFFless
        env:
          BFFLESS_API_URL: ${{ vars.BFFLESS_URL }}
          BFFLESS_API_KEY: ${{ secrets.BFFLESS_API_KEY }}
          # Empty var → falls back to .bffless/config.json's `bffless/apps`;
          # forkers set this repo var to target their own project.
          BFFLESS_PROJECT: ${{ vars.BFFLESS_PROJECT }}
        # Handoff's backend is two sets on one alias: the app API, and the public folder feeds
        # (kept separate so the feeds can be attached on their own).
        run: |
          set -o pipefail
          npx --yes bffless@^0.2.0 rules push apps/handoff/.bffless/proxy-rules/handoff apps/handoff/.bffless/proxy-rules/handoff-rss-feed ${BFFLESS_PROJECT:+--project "$BFFLESS_PROJECT"} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deploy to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: apps/handoff/dist
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: handoff
          # Attach the Handoff backend (presigned uploads, node tree, serving,
          # ACL, grants, share links) + the public folder feeds.
          proxy-rule-set-names: handoff,handoff-rss-feed
