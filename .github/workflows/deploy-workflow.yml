name: Deploy Workflow harness to BFFless
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['apps/workflow/**']
concurrency: { group: deploy-workflow, cancel-in-progress: false }
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bffless/workflow-lint build
      # Same order as workflow-app.yml, so the harness deployed here is the
      # artefact CI tested: the MSW mock inlines `hello-dist/islands/*.html`
      # through an `import.meta.glob` at build time (mocks-only chunk, loaded
      # under `?mocks=on`), which is empty unless the bundle is staged first.
      # An island type error fails the job here, before anything is uploaded.
      - name: Stage the hello implementation bundle
        run: pnpm --filter workflow stage
      - run: pnpm --filter workflow build
      - run: pnpm --filter workflow test:run
      - run: pnpm --filter workflow test:stage
      - name: Sync proxy rules (workflow + hello)
        uses: bffless/deploy-proxy-rules@v1
        with:
          path: |
            apps/workflow/.bffless/proxy-rules/workflow
            apps/workflow/.bffless/proxy-rules/hello
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_WORKFLOW_API_KEY }}
          project: bffless/workflow
          summary-title: Workflow Proxy Rules
          prune: true
      - name: Deploy the harness
        uses: bffless/upload-artifact@v1
        with:
          path: apps/workflow/dist
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_WORKFLOW_API_KEY }}
          repository: bffless/workflow
          alias: workflow
          proxy-rule-set-names: workflow,hello
      - name: Deploy the hello implementation
        # The bundle is `.bffless/workflows/*` (the YAMLs + index.json), `islands/*.html`
        # (one self-contained file each), `scripts/*.js` (copied verbatim — the Worker
        # imports the module text as written) and a one-line `index.html` landing page;
        # upload-artifact >= 1.4.2 keeps `.bffless/` directories while walking (and
        # CE >= 0.4.33 keeps them in the zip fallback).
        uses: bffless/upload-artifact@v1
        with:
          path: apps/workflow/hello-dist
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_WORKFLOW_API_KEY }}
          repository: bffless/workflow
          alias: hello
          proxy-rule-set-names: hello
