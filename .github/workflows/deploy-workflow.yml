name: Deploy Workflow harness to BFFless
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['apps/workflow/**']
concurrency: { group: deploy-workflow, cancel-in-progress: false }
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bffless/workflow-lint build
      # Same order as workflow-app.yml, so the harness deployed here is the
      # artefact CI tested: the MSW mock inlines `hello-dist/islands/*.html`
      # through an `import.meta.glob` at build time (mocks-only chunk, loaded
      # under `?mocks=on`), which is empty unless the bundle is staged first.
      # `hello` itself is published by its own repo's `deploy.yml`
      # (`bffless/workflow-hello`, via `bffless/publish-workflow@v1`) — this
      # step only clones it at the pinned `hello.ref` and builds it so the
      # harness's own mocks/tests have `hello-dist/` to read (M3 Task 7).
      - name: Stage the hello implementation bundle
        run: pnpm --filter workflow stage
      - run: pnpm --filter workflow build
        env:
          # apps#363: scopes discovery to this harness's own project — without
          # it the relay lists every alias the calling session can see. Unset
          # everywhere else (dev, mocks, CI) on purpose: workflow-app.yml below
          # tests the unscoped path its mocks/fixtures actually exercise.
          VITE_BFFLESS_PROJECT: bffless/workflow
          # apps#526: the harness build the diagnostics payload names.
          # Deliberately unset in workflow-app.yml, so PR CI reads `dev`.
          VITE_BUILD_SHA: ${{ github.sha }}
      - run: pnpm --filter workflow test:run
      - run: pnpm --filter workflow test:stage
      - name: Sync proxy rules (workflow)
        uses: bffless/deploy-proxy-rules@v1
        with:
          path: apps/workflow/.bffless/proxy-rules/workflow
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_WORKFLOW_API_KEY }}
          project: bffless/workflow
          summary-title: Workflow Proxy Rules
          prune: true
      - name: Deploy the harness
        uses: bffless/upload-artifact@v1
        with:
          path: apps/workflow/dist
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_WORKFLOW_API_KEY }}
          repository: bffless/workflow
          alias: workflow
          proxy-rule-set-names: workflow
