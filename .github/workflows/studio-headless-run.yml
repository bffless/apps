name: Studio Headless Run

# Unattended Import → Prep → Auto Build → Export against the real Studio site.
# Dispatch-only: every run spends real AI credits (transcribe, director,
# refine, voice, describe, thumbnail, optional blog). The finished project
# appears in your own project list via server sync; the job summary links
# straight to its Export page and carries the generated title, description,
# and (opt-in) blog post; the artifact carries the thumbnail + blog bundle.
on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: 'Source video URL(s), comma-separated (the UI input is single-line; newlines also work when dispatched via API)'
        required: true
        type: string
      director_prompt:
        description: 'Optional guidance for the master director'
        required: false
        type: string
        default: ''
      project_title:
        description: 'Optional project name'
        required: false
        type: string
        default: ''
      base_url:
        description: 'Studio deployment to drive (blank = repo var / studio.j5s.dev)'
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: 'Overall job timeout (must exceed runner phase ceilings: prep 30 min × number of videos + director 10 min + build 90 min + export ~30 min)'
        required: false
        type: number
        default: 210
      thumbnail_prompt:
        description: 'Optional direction for the YouTube thumbnail ("What should the thumbnail be like?")'
        required: false
        type: string
        default: ''
      thumbnail_reference_url:
        description: 'Optional image URL (e.g. a Handoff share link) attached as the thumbnail reference'
        required: false
        type: string
        default: ''
      generate_blog:
        description: 'Also generate the blog post (bundle lands in the artifact + summary)'
        required: false
        type: boolean
        default: false
      blog_direction:
        description: 'Optional direction for the blog post'
        required: false
        type: string
        default: ''
      # NOTE: workflow_dispatch caps at 10 inputs — the old ffmpeg_mt input made
      # 11, so it moved to the STUDIO_FFMPEG_MT repo variable (rarely-used debug
      # escape hatch; the proven default is Chrome + the single-threaded core).
      # The video-backend override rides the same way: the STUDIO_VIDEO_BACKEND
      # repo variable (wasm | server | local | remote; unset = the app's choice).
      browser:
        description: 'Browser to drive the site with. Chrome is the proven default: Chrome+ST built 4 scenes in 25 min (run 31552803617) while Firefox+ST could not finish one scene cut.'
        required: false
        type: choice
        options:
          - chrome
          - firefox
        default: chrome

concurrency:
  group: studio-headless-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      # The action lives in this repo, so use the local-path form. Other repos
      # use `bffless/apps/apps/studio/headless@studio-vX.Y.Z` — see
      # apps/studio/headless/README.md ("Use as a GitHub Action").
      - uses: actions/checkout@v4
      - name: Studio headless run
        id: studio
        uses: ./apps/studio/headless
        with:
          base-url: ${{ inputs.base_url != '' && inputs.base_url || vars.STUDIO_BASE_URL != '' && vars.STUDIO_BASE_URL || 'https://studio.j5s.dev' }}
          video-urls: ${{ inputs.video_urls }}
          user-email: ${{ secrets.STUDIO_USER_EMAIL }}
          user-password: ${{ secrets.STUDIO_USER_PASSWORD }}
          director-prompt: ${{ inputs.director_prompt }}
          project-title: ${{ inputs.project_title }}
          thumbnail-prompt: ${{ inputs.thumbnail_prompt }}
          thumbnail-reference-url: ${{ inputs.thumbnail_reference_url }}
          generate-blog: ${{ inputs.generate_blog && 'true' || 'false' }}
          blog-direction: ${{ inputs.blog_direction }}
          browser: ${{ inputs.browser }}
          ffmpeg-mt: ${{ vars.STUDIO_FFMPEG_MT == 'true' && 'true' || 'false' }}
          video-backend: ${{ vars.STUDIO_VIDEO_BACKEND }}
          artifact-name: run-output
