name: Deploy Reader to BFFless

# One workflow per app: pushes that touch apps/reader (or this file) deploy Rivulet,
# and it can always be run by hand. Clone the monorepo, set BFFLESS_URL +
# BFFLESS_API_KEY on your fork, and deploy just this app.
#
# Deploys happen on a merge to main AND on pushes to a `bapps-**` working branch
# (so you can see the app live before merge), plus ad-hoc via workflow_dispatch
# (Actions tab → Run workflow → pick any branch). All target the `reader` alias.
on:
  push:
    branches: [main, 'bapps-**']
    paths:
      - 'apps/reader/**'
      - '.github/workflows/deploy-reader.yml'
  workflow_dispatch:

concurrency:
  group: deploy-reader
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter reader build

      - name: Run unit tests
        run: pnpm --filter reader test:run

      # Requires CE >= 0.2.0 on the instance.
      - name: Sync proxy rules to BFFless
        uses: bffless/deploy-proxy-rules@v1
        with:
          path: apps/reader/.bffless/proxy-rules/reader
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          summary-title: Reader Proxy Rules

      - name: Deploy to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: apps/reader/dist
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: reader
          # Attach the Rivulet backend (auth reverse-proxy; feed/item/refresh
          # rules land with later stories).
          proxy-rule-set-names: reader
