name: Preview Handoff on BFFless

# PR previews for Handoff. Any PR that touches apps/handoff (or this file) builds
# the app and deploys it to the shared `handoff-preview` alias, then comments the
# URL on the PR. The alias is reused — the newest PR build wins — so this is best
# for one preview at a time. We deliberately reuse one stable alias rather than
# minting a per-PR alias: each new alias is a new origin that would need its own
# GCS bucket CORS entry (Handoff's presigned uploads go browser→bucket directly).
#
# RULES: on a pull_request run, the branch's rule sets are synced with a pr-<N>
# name suffix (handoff-pr-<N> / handoff-rss-feed-pr-<N> — never the bare names,
# so a PR can NEVER push rules onto the live production sets) and attached to the
# preview alias. The preview therefore exercises the PR's OWN backend routes —
# rule-changing PRs preview correctly (bffless/apps#258 previously 404'd its new
# routes because this workflow attached the production sets). Mirrors Reader's
# per-PR-set flow (preview-reader.yml); only the alias stays shared, for the
# bucket-CORS reason above. Suffixed sets accumulate per PR — delete them (and
# detach) when the PR closes, until a cleanup workflow exists for Handoff.
# workflow_dispatch (no PR number) skips the sync and attaches the production
# sets, same as before this flow existed.
on:
  pull_request:
    paths:
      - 'apps/handoff/**'
      - '.github/workflows/preview-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter handoff build

      # esbuild strips types from the .fn.ts rule handlers without checking them, so this is the
      # only thing standing between a type error and production. Cheap — run it on every PR.
      - name: Typecheck proxy-rule handlers
        run: pnpm --filter handoff typecheck:rules

      - name: Compute preview identifiers
        id: ids
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "suffix=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "set-names=handoff-pr-${{ github.event.pull_request.number }},handoff-rss-feed-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "set-names=handoff,handoff-rss-feed" >> "$GITHUB_OUTPUT"
          fi

      # PR-only: on workflow_dispatch, ids.outputs.suffix is empty, so this would
      # otherwise sync straight onto the LIVE handoff sets instead of per-PR ones.
      - name: Sync PR preview proxy rules
        if: github.event_name == 'pull_request'
        uses: bffless/deploy-proxy-rules@v1
        with:
          path: |
            apps/handoff/.bffless/proxy-rules/handoff
            apps/handoff/.bffless/proxy-rules/handoff-rss-feed
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          # Empty var → action falls back to .bffless/config.json's `bffless/apps`;
          # forkers set this repo var to target their own project.
          project: ${{ vars.BFFLESS_PROJECT }}
          name-suffix: ${{ steps.ids.outputs.suffix }}
          summary-title: Handoff Preview Proxy Rules
          pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy preview to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: apps/handoff/dist
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: handoff-preview
          # PR runs attach the pr-<N> suffixed sets synced above; manual dispatch
          # runs attach the production sets (no branch rules were synced).
          proxy-rule-set-names: ${{ steps.ids.outputs.set-names }}
          description: 'Handoff preview for PR #${{ github.event.pull_request.number }}'
          summary-title: Handoff Preview
          pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
