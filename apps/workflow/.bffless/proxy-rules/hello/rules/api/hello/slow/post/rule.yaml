targetUrl: pipeline
order: 31
pipeline:
  name: Hello slow job (enqueue + poll)
  description: "POST { lines, photo, outPrefix } -> { jobId, status: 'pending' } immediately; the report renders in postSteps (studio enqueue+postSteps pattern) and the client polls GET /api/hello/job?id=. The real service never answers 503 BUSY — retry.if in the workflow's slow step simply never fires live (mock-only, exercised by unit tests). startedMs: now() writes the ISO string into a number-typed field; data_create's schema coercion stores it as epoch ms (same pattern as handoff's grants rule, createdMs: now())."
  steps:
    - id: createJob
      name: createJob
      handler: data_create
      config:
        schemaId: $schema:hello_jobs
        fields:
          status: "'pending'"
          request: request.body
          startedMs: now()
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: |-
          {
            "jobId": "{{steps.createJob.id}}",
            "status": "pending"
          }
        status: 200
        contentType: application/json
  postSteps:
    - id: setRunning
      name: setRunning
      handler: data_update
      config:
        schemaId: $schema:hello_jobs
        recordId: steps.createJob.id
        fields:
          status: "'running'"
    - id: work
      name: work
      handler: function_handler
      code: ./work.fn.js
    - id: finish
      name: finish
      handler: data_update
      config:
        schemaId: $schema:hello_jobs
        recordId: steps.createJob.id
        fields:
          status: "'done'"
          result: steps.work
  validators:
    - type: auth_required
      config: { allowApiKey: true }
description: "Hello implementation surface 2/4: slow job + poll."
