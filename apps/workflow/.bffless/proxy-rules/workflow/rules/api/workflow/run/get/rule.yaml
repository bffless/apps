targetUrl: pipeline
order: 12
pipeline:
  name: Get workflow run record
  description: "One run row + every step row — what the run page, Resume and read-only views rebuild state from (spec 05). Gated by the shared run gate (spec 11 D26)."
  steps:
    - id: run
      name: run
      handler: data_query
      config:
        schemaId: $schema:workflow_runs
        limit: 1
        filters:
          runId: { op: eq, value: request.query.id }
    # The shared gate (spec 11 D26): may this caller see this run? UNLIKE
    # every other gated rule, this one renders NO 404 responder for a
    # `notFound` (Decision 4) — an id nothing was recorded for and a run this
    # caller cannot reach must answer the identical 200
    # `{ run: null, steps: [] }`, so a run id in this URL leaks nothing about
    # whether it exists. `shape.fn.js` reads `steps.runGate.ok` to decide
    # whether to hand back the rows this rule already queried.
    - id: runGate
      name: runGate
      handler: function_handler
      code: ../../../../../mcp-fn/runGate.fn.js
    - id: steps
      name: steps
      handler: data_query
      config:
        condition: steps.runGate.ok
        schemaId: $schema:workflow_run_steps
        limit: 1000
        filters:
          runId: { op: eq, value: request.query.id }
    - id: shape
      name: shape
      handler: function_handler
      code: ./shape.fn.js
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: "{{{steps.shape}}}"
        status: 200
        headers: { Cache-Control: no-store }
        contentType: application/json
  validators:
    - type: auth_required
      config: { allowApiKey: true, requiredScopes: [workflow:read] }
description: "Run record: { run, steps } or { run: null, steps: [] } when the id is unknown OR not visible to this caller (Decision 4, spec 11 D26)."
