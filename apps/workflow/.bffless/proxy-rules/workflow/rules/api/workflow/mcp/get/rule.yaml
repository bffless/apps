targetUrl: pipeline
order: 31
pipeline:
  name: MCP endpoint (GET)
  description: "The stateless Streamable-HTTP profile (spec 10, D22): GET would open an SSE stream, which this endpoint does not offer, so it is 405 with Allow: POST. Without this rule an unmatched GET falls through to the SPA's index.html with 200."
  steps:
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: '{"jsonrpc":"2.0","id":null,"error":{"code":-32600,"message":"Method Not Allowed: this MCP endpoint is stateless — POST one JSON-RPC message"}}'
        status: 405
        headers: { Allow: POST, Cache-Control: no-store }
        contentType: application/json
description: "405 for GET on the MCP endpoint (stateless profile, no SSE)."
