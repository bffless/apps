methods:
  - GET
  - POST
  - DELETE
targetUrl: pipeline
order: 30
pipeline:
  name: MCP endpoint
  description: "POST /api/workflow/mcp — the harness's MCP server as ONE rule on CE's generic mcp_handler (spec 10, D22 GA). tools/list IS the catalog: this config is rendered from @bffless/workflow-agent-tools at build time and held fresh by bundle.test.ts (D19). Every tool is a sibling rule under mcp-tools/, executed in-process as the caller with its own requiredScopes (D23); GET/DELETE → 405 (stateless, no SSE)."
