                  description: The run to act on. Optional where a current run exists (the harness page); required over the MCP endpoint.
              required: []
              additionalProperties: false
            annotations:
              readOnlyHint: true
            rule:
              path: /api/workflow/mcp-tools/status
              method: POST
          - name: workflow.await
