            inputSchema:
              type: object
              properties:
                runId: *a3
                until:
                  type: string
                  enum:
                    - waiting
                    - terminal
                  description: "`waiting`: resolve as soon as the run needs input (a step is `waiting`) or ends; `terminal`: resolve only when the run ends."
                timeoutMs:
                  type: integer
                  minimum: 1
                  maximum: 600000
                  description: "How long to wait before answering with the current snapshot and `timedOut: true` (default 120000)."
              required:
                - until
              additionalProperties: false
            annotations:
              readOnlyHint: true
            rule:
              path: /api/workflow/mcp-tools/await
              method: POST
          - name: workflow.runs
            description: "Past runs of one workflow, newest first: id, status, when it started and ended, and which steps it is waiting on."
            inputSchema:
              type: object
              properties:
