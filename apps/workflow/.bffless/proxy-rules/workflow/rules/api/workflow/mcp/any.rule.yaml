              properties:
                impl: &a1
                  type: string
                  description: The implementation alias, e.g. `hello`.
                workflow: &a2
                  type: string
                  description: The workflow id — the file base name minus `.workflow.yaml`, e.g. `interactive`.
              required:
                - impl
                - workflow
              additionalProperties: false
            annotations:
              readOnlyHint: true
            rule:
              path: /api/workflow/mcp-tools/describe
              method: POST
          - name: workflow.start
            description: Start a run of a workflow with the given inputs. Validated exactly as the kickoff form validates a person’s values; a refusal names each bad input. Returns the run id and its first snapshot, and moves the page to the run.
            inputSchema:
              type: object
              properties:
                impl: *a1
                workflow: *a2
                inputs:
                  type: object
                  description: Values for `on.manual.inputs`, keyed by input name. An omitted input takes its declared default; a `file` input is a whole File ref (`{ path, name, contentType, size, url }`), never a bare path or a URL. Pass `{}` for a workflow with no inputs.
                  additionalProperties: true
              required:
                - impl
                - workflow
                - inputs
              additionalProperties: false
            annotations:
              readOnlyHint: false
            rule:
              path: /api/workflow/mcp-tools/start
              method: POST
          - name: workflow.status
            description: "The run snapshot: status, the steps in flight, every reached step’s status, the outputs so far, and `waitingOn` — for each waiting step what would satisfy it (its kind, its evaluated inputs, an island’s declared outputs and src)."
