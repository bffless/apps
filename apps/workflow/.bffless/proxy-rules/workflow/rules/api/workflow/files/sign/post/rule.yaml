targetUrl: pipeline
order: 19
pipeline:
  name: Sign workflow file
  description: "POST { path } -> { url, expiresIn }: a presigned GET for an object under the harness prefix (workflows/…), so a sandboxed island (opaque origin, no cookie) can play media (plan Decision 6). Bucket storage (GCS/S3) presigns an absolute URL and needs nothing. Local-FS storage presigns too (an HMAC /api/storage/presigned/local URL), but that URL is RELATIVE unless PUBLIC_ORIGIN is set — and a relative src cannot resolve inside an opaque-origin srcdoc frame, so a local-storage install must set PUBLIC_ORIGIN. Range on the presigned URL is the storage backend's."
  steps:
    - id: confine
      name: confine
      handler: function_handler
      code: ./confine.fn.js
    - id: refuse
      name: refuse
      handler: response_handler
      config:
        condition: steps.confine.notOk
        body: '{"error":"path must be an uploads-relative key under workflows/ with no traversal"}'
        status: 400
        contentType: application/json
    - id: sign
      name: sign
      handler: signed_url
      config:
        condition: steps.confine.ok
        path: steps.confine.storagePath
        expiresIn: 3600
    - id: respond
      name: respond
      handler: response_handler
      config:
        condition: steps.confine.ok
        body: '{"url":"{{{steps.sign.url}}}","expiresIn":3600}'
        status: 200
        headers: { Cache-Control: no-store }
        contentType: application/json
  validators:
    - type: auth_required
      config: { allowApiKey: true }
description: "Files quartet 4/4: sign a run/inputs object for a sandboxed island's <video>/<audio>/<img>."
