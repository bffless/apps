handler: ./normalize.fn.js
cases:
  # Every `ok:true` case below carries `run-1` (a hyphen, not `run_1`), so none
  # of them names a run under `RUN_ID_PATTERN` (spec 11 D29 — `run_` is a
  # literal, not a separator) and all three are `runless` — they still exercise
  # the normalisation this fixture is pinning either way.
  - name: passes through a full key already minted by prepare
    data:
      request:
        body:
          storageKey: acme/site/uploads/workflows/workflow-studio/studio/runs/run-1/inputs/a.mp4
          impl: workflow-studio
          workflow: studio
      deployment: { owner: acme, repo: site }
    expect:
      result:
        ok: true
        notOk: false
        storageKey: acme/site/uploads/workflows/workflow-studio/studio/runs/run-1/inputs/a.mp4
        error: ""
        hasRun: false
        runId: ""
        runless: true
  - name: prefixes a bare uploads-relative path a pipeline step returned
    data:
      request:
        body:
          storageKey: workflows/workflow-studio/studio/runs/run-1/per-video/0/audio/audio.wav
          impl: workflow-studio
          workflow: studio
      deployment: { owner: acme, repo: site }
    expect:
      result:
        ok: true
        notOk: false
        storageKey: acme/site/uploads/workflows/workflow-studio/studio/runs/run-1/per-video/0/audio/audio.wav
        error: ""
        hasRun: false
        runId: ""
        runless: true
  - name: normalises a leading /api/uploads/ prefix
    data:
      request:
        body:
          storageKey: /api/uploads/workflows/workflow-studio/studio/runs/run-1/inputs/a.mp4
          impl: workflow-studio
          workflow: studio
      deployment: { owner: acme, repo: site }
    expect:
      result:
        ok: true
        notOk: false
        storageKey: acme/site/uploads/workflows/workflow-studio/studio/runs/run-1/inputs/a.mp4
        error: ""
        hasRun: false
        runId: ""
        runless: true
  - name: recognises a runId matching RUN_ID_PATTERN
    data:
      request:
        body:
          storageKey: workflows/workflow-studio/studio/runs/run_01M17/per-video/0/audio/audio.wav
          impl: workflow-studio
          workflow: studio
      deployment: { owner: acme, repo: site }
    expect:
      result:
        ok: true
        notOk: false
        storageKey: acme/site/uploads/workflows/workflow-studio/studio/runs/run_01M17/per-video/0/audio/audio.wav
        error: ""
        hasRun: true
        runId: run_01M17
        runless: false
  - name: refuses a path outside the harness's workflows/ prefix
    data:
      request:
        body:
          storageKey: projects/p1/uploads/a.mp4
          impl: workflow-studio
          workflow: studio
      deployment: { owner: acme, repo: site }
    expect:
      result:
        ok: false
        notOk: true
        storageKey: ""
        error: storageKey must be an uploads-relative path under workflows/ with no traversal
        hasRun: false
        runId: ""
        runless: false
  - name: refuses path traversal
    data:
      request:
        body:
          storageKey: workflows/../etc/passwd
          impl: workflow-studio
          workflow: studio
      deployment: { owner: acme, repo: site }
    expect:
      result:
        ok: false
        notOk: true
        storageKey: ""
        error: storageKey must be an uploads-relative path under workflows/ with no traversal
        hasRun: false
        runId: ""
        runless: false
  - name: refuses an empty storageKey
    data:
      request:
        body:
          storageKey: ""
          impl: workflow-studio
          workflow: studio
      deployment: { owner: acme, repo: site }
    expect:
      result:
        ok: false
        notOk: true
        storageKey: ""
        error: storageKey must be an uploads-relative path under workflows/ with no traversal
        hasRun: false
        runId: ""
        runless: false
  - name: refuses an impl or workflow that is not a single segment
    data:
      request:
        body:
          storageKey: workflows/workflow-studio/studio/inputs/a.mp4
          impl: workflow-studio
          workflow: x/runs/run_VICTIM/step
      deployment: { owner: acme, repo: site }
    expect:
      result:
        ok: false
        notOk: true
        storageKey: ""
        error: impl and workflow must each be a single path segment
        hasRun: false
        runId: ""
        runless: false
