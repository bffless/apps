targetUrl: pipeline
order: 16
pipeline:
  name: Delete workflow run
  description: "POST { id }: owner (startedBy == user.id) or admin; terminal runs only (409 while running). Deletes the run's storage prefix first (retryable), then the workflow_files records under it, the step rows, the run row. Every step is idempotent, so a call that fails part-way is fixed by calling again with the same id. The per-workflow inputs/ area is never touched (D18)."
  steps:
    - id: run
      name: run
      handler: data_query
      config:
        schemaId: $schema:workflow_runs
        pageSize: 1
        filters:
          runId: { op: eq, value: request.body.id }
    - id: gate
      name: gate
      handler: function_handler
      code: ./gate.fn.js
    # Three refusals, not one: response_handler's `status` must be a literal number
    # (response.handler.ts validateConfig — an expression string is a ConfigurationError),
    # so each status is its own step gated on its own flag. Exactly one of the four
    # responders below ever runs, and a skipped step leaves the response to the last one
    # that did (pipeline-execution.service.ts) — which is why every later step is gated
    # on `steps.gate.ok` too.
    - id: refuse-404
      name: refuse-404
      handler: response_handler
      config:
        condition: steps.gate.notFound
        body: "{{{steps.gate.result}}}"
        status: 404
        headers: { Cache-Control: no-store }
        contentType: application/json
    - id: refuse-409
      name: refuse-409
      handler: response_handler
      config:
        condition: steps.gate.running
        body: "{{{steps.gate.result}}}"
        status: 409
        headers: { Cache-Control: no-store }
        contentType: application/json
    - id: refuse-403
      name: refuse-403
      handler: response_handler
      config:
        condition: steps.gate.forbidden
        body: "{{{steps.gate.result}}}"
        status: 403
        headers: { Cache-Control: no-store }
        contentType: application/json
    # Bytes first: a half-done delete that is retried must never leave a row pointing at
    # objects that are already gone.
    #
    # Retry story (apps#381). Files-first has a cost: if `recs`, `stepRows` or `row`
    # fails after `file_delete` succeeded, the pipeline stops there and the run row
    # survives with its bytes gone. That run is NOT stuck — every step here is
    # idempotent, so the fix is to POST the same `{ id }` again: the gate still passes
    # (the row is still there, still terminal, same owner), `file_delete` answers
    # `{ deleted: 0 }` for a prefix that matches nothing rather than erroring, and the
    # three deletes resume. So a *transient* failure costs one retry and the reported
    # `files` count drops to 0 on the successful attempt — expected, not a regression.
    # A *persistent* `recs` failure (a missing schema, a filter CE rejects) fails every
    # retry at the same step and does leave a run that cannot be deleted through this
    # rule; that is an operator fix — correct the schema/filter and retry, or drop the
    # row from the admin panel. Deliberately no `dryRun` mode: a preview of what would
    # be swept is a second code path over the same filters, and the 200's `records`
    # count already reports the sweep after the fact.
    #
    # `prefix` is a TEMPLATE, not a bare expression
    # (file-delete.handler.ts resolveAndGuard -> evaluateTemplate); it is relative to the
    # project's uploads root, blank/`..` are refused, and a prefix matching nothing is
    # `{ deleted: 0 }`, not an error — so the whole step is idempotent.
    - id: files
      name: files
      handler: file_delete
      config:
        condition: steps.gate.ok
        prefix: "{{steps.gate.prefix}}"
    # The upload records CE wrote for those objects. The field is `storage_path`, in
    # snake_case: register_upload writes the record itself (upload-record.service.ts
    # createUploadRecords) with CE's own column names, unlike the run/step rows, which
    # this rule set writes with the camelCase names its schemas declare.
    - id: recs
      name: recs
      handler: data_delete
      config:
        condition: steps.gate.ok
        schemaId: $schema:workflow_files
        filters:
          storage_path: { op: like, value: steps.gate.prefixLike }
    # `stepRows`, not `steps`: a step named `steps` reads as the expression root every
    # other step's `condition` is written against (`steps.gate.ok`), and `steps.steps.*`
    # is a sentence nobody should have to parse. Nothing referenced it — the 200 below
    # reports the `files` and `recs` counts only — so the rename is inert.
    - id: stepRows
      name: stepRows
      handler: data_delete
      config:
        condition: steps.gate.ok
        schemaId: $schema:workflow_run_steps
        filters:
          runId: { op: eq, value: request.body.id }
    - id: row
      name: row
      handler: data_delete
      config:
        condition: steps.gate.ok
        schemaId: $schema:workflow_runs
        recordId: steps.gate.recordId
    # Both counts are reported, and `records` is the one that matters: the `recs` sweep is
    # the only step whose correctness rides on a CE implementation detail (the full-key
    # shape of `storage_path`), and a filter that stops matching deletes 0 rows *without*
    # failing. A `records` of 0 next to a non-zero `files` is that regression, visible.
    # `{{…}}` renders each number bare (double braces stringify a primitive as-is), and the
    # `}}}}` tail is safe: evaluateTemplate scans the original template once and only tries
    # `{{{` where three braces actually open.
    - id: respond
      name: respond
      handler: response_handler
      config:
        condition: steps.gate.ok
        body: '{"ok":true,"deleted":{"files":{{steps.files.deleted}},"records":{{steps.recs.count}}}}'
        status: 200
        headers: { Cache-Control: no-store }
        contentType: application/json
  validators:
    - type: auth_required
      config: { allowApiKey: true }
description: "Delete a run: its storage prefix, its file records, its step rows and the run row — owner or admin, terminal runs only. Kickoff inputs are kept (D18)."
