targetUrl: pipeline
order: 22
pipeline:
  name: Serve workflow files
  description: "Files trio 3/3: Range-aware serve of the workflows/ prefix (video seeking). The download key asks CE's file_serve_handler to answer ?download=1 with Content-Disposition: attachment (filename = the upload record's original_name, else the key basename); a value of 1 is truthy, while 0, false, no, off and an empty value stay inline. A CE that predates bffless/ce#714 ignores the unknown key and serves inline exactly as it does today, so this is inert until that lands and j5s.dev redeploys (apps#362). Lives at /api/uploads/workflows/* because CE's file_serve_handler derives the object from a /api/uploads/<subDir>/ request path only — it is also the publicPath presigned_upload mints, so the File ref url is CE's own. Gated by the shared run gate (spec 11 D29): a request under a run's runs/<runId>/ prefix is only servable to that run's owner/driver/all-scope; inputs/ stays member-wide. Unlike sign/prepare/register this rule has no 400 refusal — a path that fails to parse is simply hasRun:false, so `runGate` runs unconditionally (there is no earlier 400 a later-run refuse-404 could clobber) and answers notFound; the route's only failure mode is 404."
  steps:
    - id: confine
      name: confine
      handler: function_handler
      code: ./confine.fn.js
    - id: run
      name: run
      handler: data_query
      config:
        condition: steps.confine.hasRun
        schemaId: $schema:workflow_runs
        limit: 1
        filters:
          runId: { op: eq, value: steps.confine.runId }
    - id: runGate
      name: runGate
      handler: function_handler
      code: ../../../../../mcp-fn/runGate.fn.js
    - id: refuse-404
      name: refuse-404
      handler: response_handler
      config:
        condition: steps.runGate.notFound
        body: '{"error":"not found"}'
        status: 404
        headers: { Cache-Control: no-store }
        contentType: application/json
    - id: serve
      name: serve
      handler: file_serve_handler
      config:
        condition: steps.runGate.ok
        subDir: workflows
        download: request.query.download
  validators:
    - type: auth_required
      config: { allowApiKey: true, requiredScopes: [workflow:files] }
description: "auth_required file serving from the harness-owned run storage. Gated by the shared run gate (spec 11 D29)."
