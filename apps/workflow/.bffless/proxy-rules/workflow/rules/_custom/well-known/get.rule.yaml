pathPattern: /.well-known/oauth-protected-resource*
targetUrl: pipeline
order: 32
pipeline:
  name: OAuth protected-resource metadata
  description: "RFC 9728: the document an MCP client reads before it has any credential. CE's oauth_protected_resource handler serves it, so the catalog app stays instance-agnostic (06) without shipping discovery code — resource is this host plus /api/workflow/mcp, authorization_servers is CE's real OAuth issuer (not a guess at admin.<domain>), and scopes_supported is derived from the requiredScopes on the mcp_handler's sibling tool rules (workflow:read, workflow:run, workflow:files). The handler answers regardless of deployment visibility (spec 10, D23 rung 3), so there is no bypassVisibility to remember, and it matches the path-suffixed form a client tries first (…/oauth-protected-resource/api/workflow/mcp) too."
  steps:
    - id: prm
      name: prm
      handler: oauth_protected_resource
      config:
        resource: /api/workflow/mcp
        resourceName: BFFless Workflow
        resourceDocumentation: https://github.com/bffless/apps/blob/main/apps/workflow/docs/spec/10-agent-embedding.md
description: "OAuth discovery for the MCP endpoint (RFC 9728), pre-credential by definition — served despite visibility."
