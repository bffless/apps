targetUrl: pipeline
order: 12
pipeline:
  name: Mark all read
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: folderFeeds
      name: folderFeeds
      handler: data_query
      config:
        limit: 500
        filters:
          userId:
            op: eq
            value: user.id
        schemaId: $schema:reader_feeds
        condition: steps.prep.hasFolder
    - id: folderUrls
      name: folderUrls
      handler: function_handler
      code: ./folderUrls.fn.js
      config:
        condition: steps.prep.hasFolder
    - id: updAll
      name: updAll
      handler: data_update
      config:
        fields:
          read: steps.prep.yes
        filters:
          read:
            op: eq
            value: false
          userId:
            op: eq
            value: user.id
        filterLogic: and
        schemaId: $schema:reader_items
        condition: steps.prep.isAllOrRiver
    - id: updStarred
      name: updStarred
      handler: data_update
      config:
        fields:
          read: steps.prep.yes
        filters:
          read:
            op: eq
            value: false
          starred:
            op: eq
            value: true
          userId:
            op: eq
            value: user.id
        schemaId: $schema:reader_items
        condition: steps.prep.isStarred
        filterLogic: and
    - id: updFeed
      name: updFeed
      handler: data_update
      config:
        fields:
          read: steps.prep.yes
        filters:
          read:
            op: eq
            value: false
          feedId:
            op: eq
            value: steps.prep.feedId
          userId:
            op: eq
            value: user.id
        schemaId: $schema:reader_items
        condition: steps.prep.isFeed
        filterLogic: and
    - id: updFolder
      name: updFolder
      handler: data_update
      config:
        fields:
          read: steps.prep.yes
        filters:
          read:
            op: eq
            value: false
          feedId:
            op: in
            value: steps.folderUrls.urls
          userId:
            op: eq
            value: user.id
        schemaId: $schema:reader_items
        condition: steps.prep.isFolder
        filterLogic: and
    - id: assemble
      name: assemble
      handler: function_handler
      code: ./assemble.fn.js
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: '{"updated":{{steps.assemble.updated}}}'
        status: 200
        headers:
          Cache-Control: no-store
        contentType: application/json
  validators:
    - type: auth_required
      config:
        allowApiKey: true
description: "Mark all read for a view: POST { view, feedId?, folder? } -> data_update read=true where the view filter matches AND read=false. Folder uses the CE `in` operator over the folder's feed URLs. Respond { updated: n }. auth_required (allowApiKey). bffless/apps reader."
