targetUrl: pipeline
order: 13
pipeline:
  name: Set item archive state
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: query
      name: query
      handler: data_query
      config:
        filters:
          guid:
            op: eq
            value: steps.prep.guid
          userId:
            op: eq
            value: user.id
        filterLogic: and
        pageSize: 1
        schemaId: $schema:reader_items
        condition: steps.prep.hasGuid
    - id: pick
      name: pick
      handler: function_handler
      code: ./pick.fn.js
    - id: update
      name: update
      handler: data_update
      config:
        fields:
          archived: steps.prep.archived
        recordId: steps.pick.recordId
        schemaId: $schema:reader_items
        condition: steps.pick.found
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: '{"ok":true,"updated":{{steps.pick.found}}}'
        status: 200
        headers:
          Cache-Control: no-store
        condition: steps.prep.hasGuid
        contentType: application/json
    - id: respondNoGuid
      name: respondNoGuid
      handler: response_handler
      config:
        body: '{"error":"guid is required"}'
        status: 400
        headers:
          Cache-Control: no-store
        condition: steps.prep.noGuid
        contentType: application/json
  validators:
    - type: auth_required
      config:
        allowApiKey: true
description: "Set an item's archived flag: POST { guid, archived } -> prep coerces guid/archived -> query finds the reader_items row by guid -> pick recordId -> data_update writes { archived } (conditional) -> respond { ok, updated }. Archived items are hidden from views by default and prune-exempt; insert-only dedup means refresh never un-archives them. The /api/items/star twin."
