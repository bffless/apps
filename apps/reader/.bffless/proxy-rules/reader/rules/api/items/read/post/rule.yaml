targetUrl: pipeline
order: 6
pipeline:
  name: Set item read state
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: query
      name: query
      handler: data_query
      config:
        filters:
          guid:
            op: eq
            value: steps.prep.guid
          userId:
            op: eq
            value: user.id
        filterLogic: and
        pageSize: 1
        schemaId: $schema:reader_items
        condition: steps.prep.hasGuid
    - id: pick
      name: pick
      handler: function_handler
      code: ./pick.fn.js
    - id: update
      name: update
      handler: data_update
      config:
        fields:
          read: steps.prep.read
        recordId: steps.pick.recordId
        schemaId: $schema:reader_items
        condition: steps.pick.found
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: '{"ok":true,"updated":{{steps.pick.found}}}'
        status: 200
        headers:
          Cache-Control: no-store
        condition: steps.prep.hasGuid
        contentType: application/json
    - id: respondNoGuid
      name: respondNoGuid
      handler: response_handler
      config:
        body: '{"error":"guid is required"}'
        status: 400
        headers:
          Cache-Control: no-store
        condition: steps.prep.noGuid
        contentType: application/json
  validators:
    - type: auth_required
      config:
        allowApiKey: true
description: "Set an item's read flag: POST { guid, read } -> prep coerces guid/read -> query finds the reader_items row by guid -> pick recordId -> data_update writes { read } (conditional) -> respond { ok, updated }. Mark-all-read fans this out client-side over a view's unread guids. auth_required (bffless/apps#114)."
