<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rivulet — a quiet RSS reader</title>
    <!-- Apply the saved theme before first paint so a dark-mode user never sees a
         light flash. Mirrors lib/theme.ts resolution; kept in sync by useTheme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rivulet:theme')
          var choice =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
