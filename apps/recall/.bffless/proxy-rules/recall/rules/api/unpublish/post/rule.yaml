targetUrl: ""
order: 15
timeout: 30000
pipeline:
  name: Unpublish video (delete embeddings)
  description: >-
    POST /api/unpublish { videoId } -> all-sync (no postSteps -- deleting
    embeddings and flipping a status are both fast DB writes, unlike
    /api/index's transcript embedding). prep normalizes videoId and hands
    embed_store a REAL empty array via steps.prep.chunks: the expression
    evaluator has no array-literal syntax, so a bare `chunks: []` in this
    config would evaluate to the literal STRING "[]" and be rejected by
    embed_store's Array.isArray guard -- see prep.fn.js. embedStore in
    chunked mode with an empty chunks array deletes the video's existing
    transcript embeddings and stores nothing new, which is exactly
    "unpublish": the record keeps its transcript text, just drops out of
    vector search. setTranscribed then flips status back to 'transcribed'
    (the video is still fully transcribed, just not indexed/published) and
    respond returns { ok: true }. Admin-only, same as /api/index and
    /api/transcribe.
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: embedStore
      name: embedStore
      handler: embed_store
      config:
        schemaId: $schema:recall_videos
        recordId: steps.prep.videoId
        fieldName: transcript
        chunks: steps.prep.chunks
    - id: setTranscribed
      name: setTranscribed
      handler: data_update
      config:
        fields:
          status: "'transcribed'"
        recordId: steps.prep.videoId
        schemaId: $schema:recall_videos
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: |-
          {
            "ok": true
          }
        status: 200
        contentType: application/json
  validators:
    - type: auth_required
      config:
        roles: ['admin']
