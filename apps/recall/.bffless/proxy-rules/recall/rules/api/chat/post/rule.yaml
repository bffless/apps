targetUrl: ''
order: 17
timeout: 30000
debugEnabled: false
pipeline:
  name: recall RAG chat
  description: >-
    POST /api/chat -> PUBLIC RAG chat over the video library's transcripts
    (Task 10). ai_handler in chat mode, streaming, claude-haiku-4-5 via
    Anthropic. The rag-search plugin exposes a search_videos tool
    (vector_search over recall_videos.transcript, same embedding model used
    at index/search time) that the model calls before answering -- the
    system prompt requires every factual claim to cite a
    `[<title> @ mm:ss](youtube-link)` built from the tool's title/youtube_url
    fields and chunkMetadata.start (or the [t=Ns] chunk-text prefix as a
    fallback), and to decline off-library questions. Conversations/messages
    persist to recall_conversations/recall_messages, same shape as the
    chat-pipelines demo this was ported from. rate_limit is the only
    validator (keyBy 'ip', 25 requests / 5 min) -- no auth_required, this is
    the public chat surface, same policy as /api/search.

    Live hot-fix (PR-feedback-6): the rag-search plugin's default embed
    input is `{text: "<query>"}`, but nateraw/bge-large-en-v1.5 (the SAME
    model /api/search and /api/index pin) requires its input as `texts`, a
    JSON-stringified array of strings -- without `embeddingInputField`/
    `embeddingInputTemplate` the tool call failed outright with "Failed to
    generate embedding". `embeddingInputField: texts` renames the input key;
    `embeddingInputTemplate: '["{{query}}"]'` wraps the query into that
    single-element JSON array, mirroring index/search's own texts.fn.js
    convention. KNOWN LIMITATION: the plugin does plain string substitution
    into the template, not a real JSON-encode -- a query containing a
    double-quote character breaks the resulting JSON and the tool call fails
    gracefully for that one query (the assistant reports no results rather
    than crashing). A proper JSON-encode belongs in CE, not here -- tracked
    as a bffless/ce#651 follow-up.

    Conversation titles (title-conversations-from-first-message): a `prep`
    function_handler step runs before `ai` and derives a title from the
    first user message in `request.body.messages` (collapsed whitespace,
    truncated to 60 chars on a word boundary with a trailing ellipsis --
    see prep.fn.js). The ai step's `extraConversationFields: { title:
    "steps.prep.title" }` merges that into the conversation record, but
    CE's ai_handler (ensureConversationExists) only evaluates
    extraConversationFields when the conversation is first CREATED, never
    on later messages in the same thread -- so the title is set once, from
    the message that started the conversation, and never rewritten.
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: ai
      name: ai
      handler: ai_handler
      config:
        mode: chat
        model: claude-haiku-4-5
        provider: anthropic
        responseMode: stream
        maxTokens: 2048
        temperature: 0.7
        skills:
          mode: none
        plugins:
          mode: selected
          enabled:
            - rag-search
          options:
            rag-search:
              sources:
                - type: vector_search
                  toolName: search_videos
                  toolDescription: Search the video library transcripts for relevant moments.
                  schemaId: $schema:recall_videos
                  fieldName: transcript
                  embeddingModel: nateraw/bge-large-en-v1.5
                  embeddingInputField: texts
                  embeddingInputTemplate: '["{{query}}"]'
                  limit: 8
        systemPrompt: >-
          You are Recall's chat assistant. You answer questions ONLY using
          results from the `search_videos` tool, which searches this video
          library's transcripts.


          Today's date is {{now()}}


          ## Rules


          - For every question, call `search_videos` before answering. Never
          answer from general knowledge or memory -- only from what the tool
          returns.

          - Every factual claim you make MUST be followed by a citation link
          in this exact format:
          `[<video title> @ <mm:ss>](https://www.youtube.com/watch?v=<id>&t=<sec>s)`.

            - `<video title>` and `<id>` come from the result's `title` and `youtube_url` fields (extract the video id from `youtube_url`).
            - `<sec>` (used for both `<mm:ss>` and the `&t=` query param) comes from the chunk's `chunkMetadata.start` when present. If `chunkMetadata.start` is missing, parse it from the `[t=<sec>s]` prefix at the start of the chunk text instead.
            - `<mm:ss>` is `<sec>` formatted as minutes:seconds, seconds zero-padded.

          - NEVER show the raw `[t=<sec>s]` prefix to the user -- strip it
          from any quoted or paraphrased chunk text. It's a machine marker,
          not part of the transcript.

          - If `search_videos` returns nothing relevant to the question, say
          so plainly and suggest the visitor try the Search tab instead of
          guessing.

          - If a question is unrelated to this video library (general
          chit-chat, other products, unrelated topics), politely decline and
          redirect to what you can help with: finding and citing moments
          from these videos.

          - Be concise. Lead with the answer, cite as you go, don't pad with
          fluff.
        messagesField: request.body.messages
        persistMessages: true
        maxHistoryMessages: 20
        persistMessagesSchemaId: $schema:recall_messages
        persistConversationsSchemaId: $schema:recall_conversations
        extraConversationFields:
          title: steps.prep.title
      isEnabled: true
  validators:
    - type: rate_limit
      config:
        keyBy: ip
        limit: 25
        windowSeconds: 300
description: recall RAG chat handler -- public, video-transcript-grounded, rate-limited
