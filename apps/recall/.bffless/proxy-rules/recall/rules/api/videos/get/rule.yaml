targetUrl: pipeline
order: 19
pipeline:
  name: List public recall videos
  steps:
    - id: query
      name: query
      handler: data_query
      config:
        pageSize: 500
        schemaId: $schema:recall_videos
    - id: shape
      name: shape
      handler: function_handler
      code: ./shape.fn.js
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: "{{{steps.shape}}}"
        status: 200
        headers:
          Cache-Control: public, max-age=60
        contentType: application/json
  validators: []
description: >-
  List every PUBLISHED recall_videos record for the home page library grid
  (Task 11; PR-feedback-7 added `Cache-Control: public, max-age=60` — a
  1-minute shared/browser cache so repeat home-page loads and back/forward
  navigation don't re-run this data_query every time. Short enough that a
  just-published video shows up on the library grid within a minute, not
  instantly but not meaningfully stale either — this is a public content
  list, not a live status dashboard). GET /api/videos -> data_query lists
  every row (pageSize 500, no
  status filter at the query layer -- the shape step below drops
  draft/transcribing/transcribed/indexing/error rows) -> shape keeps ONLY
  status === 'published' rows and maps each to public-safe metadata: {
  videoId, title, description, youtubeId (extracted from youtube_url -- same
  regex as src/lib/youtube.ts's extractYouTubeId, duplicated here since fn.js
  sandboxes can't import app source), duration, publishedAtMs (updated_ms,
  falling back to the record's own createdAt system timestamp) } --
  transcript and both storage paths (source_path/audio_path) are NEVER
  included, unlike the admin-only GET /api/admin/videos which keeps
  status+paths for the admin table -> sorted newest-first by publishedAtMs ->
  respond { videos }. Sibling of POST /api/videos (create, admin-only) under
  the same api/videos/ method folder -- no path collision, since the
  single-video admin lookup lives at a DIFFERENT url (GET /api/videos/get,
  see _custom/videos-get) precisely so plain GET /api/videos was free for
  this public list. NO validators: public, cheap (one data_query, no
  downstream AI calls), same posture as GET /api/admin/videos.
