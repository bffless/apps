methods:
  - GET
  - HEAD
targetUrl: pipeline
stripPrefix: false
order: 19
pipeline:
  name: Handoff raw file redirect
  description: Validate a folder-scoped share token and 302-redirect to a presigned raw file URL.
  steps:
    - id: parse
      name: parse
      handler: function_handler
      code: ./parse.fn.ts
    - id: link
      name: link
      handler: data_query
      config:
        recordId: steps.parse.token
        schemaId: $schema:handoff_share_links
        condition: steps.parse.hasBoth
    - id: node
      name: node
      handler: data_query
      config:
        recordId: steps.parse.fileId
        schemaId: $schema:handoff_nodes
        condition: steps.parse.hasBoth
    - id: folders
      name: folders
      handler: data_query
      config:
        filters:
          nodeType:
            op: in
            value:
              - folder
              - root
        pageSize: 500
        schemaId: $schema:handoff_nodes
        condition: steps.parse.hasBoth
    - id: check
      name: check
      handler: function_handler
      code: ./check.fn.ts
    - id: sign
      name: sign
      handler: signed_url
      config:
        path: steps.check.storagePath
        condition: steps.check.allow
        expiresIn: 300
    - id: ok
      name: ok
      handler: response_handler
      config:
        body: ""
        status: 302
        headers:
          Location: "{{steps.sign.url}}"
        condition: steps.check.allow
        contentType: text/plain
    - id: bad
      name: bad
      handler: response_handler
      config:
        body: ""
        status: 404
        condition: steps.check.deny
        contentType: text/plain
description: Validate a folder-scoped share token and 302-redirect to a presigned raw file URL (one-request access).
