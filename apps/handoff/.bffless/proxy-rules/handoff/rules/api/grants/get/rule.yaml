targetUrl: pipeline
order: 13
pipeline:
  name: Handoff list grants
  steps:
    - id: resolveRootPre
      name: resolveRootPre
      handler: function_handler
      code: ../../../../_shared/resolveRootPre.fn.ts
    - id: rootRecord
      name: rootRecord
      handler: data_query
      config:
        filters:
          nodeType:
            op: eq
            value: root
        pageSize: 1
        schemaId: $schema:handoff_nodes
        condition: steps.resolveRootPre.isRoot
    - id: resolveRootShape
      name: resolveRootShape
      handler: function_handler
      code: ../../../../_shared/resolveRootShape.fn.ts
    - id: folder
      name: folder
      handler: data_query
      config:
        recordId: steps.resolveRootShape.effectiveFolderId
        schemaId: $schema:handoff_nodes
        condition: steps.resolveRootShape.effectiveFolderId
    - id: shape
      name: shape
      handler: function_handler
      code: ./shape.fn.ts
    - id: response
      name: response
      handler: response_handler
      config:
        body: '{"grants": {{{steps.shape.grants}}}}'
        status: 200
        contentType: application/json
  validators:
    - type: auth_required
      config:
        allowApiKey: true
description: List a folder's grants
