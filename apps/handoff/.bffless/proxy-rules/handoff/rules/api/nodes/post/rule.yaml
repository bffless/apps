targetUrl: pipeline
order: 3
pipeline:
  name: Handoff register node
  description: Register an uploaded file as a node and return the shaped Node — rejects (409) a name that duplicates an existing sibling in the target Folder (in-Folder uniqueness)
  steps:
    - id: pre
      name: pre
      handler: function_handler
      code: ./pre.fn.js
    - id: sibling
      name: sibling
      handler: data_query
      config:
        filters:
          parentId:
            op: eq
            value: request.body.parentId
        pageSize: 500
        schemaId: $schema:handoff_nodes
        condition: steps.pre.check
    - id: guard
      name: guard
      handler: function_handler
      code: ./guard.fn.js
    - id: register
      name: register
      handler: register_upload
      config:
        key: request.body.path
        subDir: content
        schemaId: $schema:handoff_nodes
        condition: steps.guard.ok
        storageKey: request.body.storageKey
        extraFields:
          ownerId: user.id
          nodeType: "'file'"
          parentId: request.body.parentId
          createdMs: request.body.createdMs
          displayName: request.body.displayName
        keyStrategy: verbatim
        maxFileSize: 524288000
        originalName: request.body.originalName
    - id: shape
      name: shape
      handler: function_handler
      code: ./shape.fn.js
      config:
        condition: steps.guard.ok
    - id: response
      name: response
      handler: response_handler
      config:
        body: '{"node": {{{steps.shape.node}}}}'
        status: 200
        condition: steps.guard.ok
        contentType: application/json
    - id: conflict
      name: conflict
      handler: response_handler
      config:
        body: '{"error":"An item with that name already exists in this folder. Rename it and try again."}'
        status: 409
        condition: steps.guard.collision
        contentType: application/json
description: Verbatim register node + in-Folder uniqueness (structural storage)
