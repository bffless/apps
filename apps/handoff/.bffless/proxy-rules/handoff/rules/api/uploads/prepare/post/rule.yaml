targetUrl: pipeline
order: 2
pipeline:
  name: Handoff presigned prepare
  description: Mint a presigned PUT for direct-to-bucket upload — rejects (409) when a sibling in the target Folder already has this name (in-Folder uniqueness), so the existing object is never overwritten
  steps:
    - id: pre
      name: pre
      handler: function_handler
      code: ./pre.fn.js
    - id: sibling
      name: sibling
      handler: data_query
      config:
        filters:
          parentId:
            op: eq
            value: request.body.parentId
        pageSize: 500
        schemaId: $schema:handoff_nodes
        condition: steps.pre.check
    - id: guard
      name: guard
      handler: function_handler
      code: ./guard.fn.js
    - id: presigned
      name: presigned
      handler: presigned_upload
      config:
        key: request.body.path
        subDir: content
        filename: request.body.filename
        condition: steps.guard.ok
        expiresIn: 3600
        keyStrategy: verbatim
        maxFileSize: 524288000
    - id: response
      name: response
      handler: response_handler
      config:
        body: "{{{steps.presigned}}}"
        status: 200
        condition: steps.guard.ok
        contentType: application/json
    - id: conflict
      name: conflict
      handler: response_handler
      config:
        body: '{"error":"An item with that name already exists in this folder. Rename it and try again."}'
        status: 409
        condition: steps.guard.collision
        contentType: application/json
description: Verbatim presigned prepare + in-Folder uniqueness (structural storage)
