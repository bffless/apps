targetUrl: pipeline
order: 14
pipeline:
  name: Handoff mint share link
  steps:
    - id: resolveRootPre
      name: resolveRootPre
      handler: function_handler
      code: ./resolveRootPre.fn.js
    - id: rootRecord
      name: rootRecord
      handler: data_query
      config:
        filters:
          nodeType:
            op: eq
            value: root
        pageSize: 1
        schemaId: $schema:handoff_nodes
        condition: steps.resolveRootPre.isRoot
    - id: rootGate
      name: rootGate
      handler: function_handler
      code: ./rootGate.fn.js
      config:
        condition: steps.resolveRootPre.isRoot
    - id: rootCreate
      name: rootCreate
      handler: data_create
      config:
        fields:
          mode: inheriting
          ownerId: user.id
          nodeType: root
          parentId: ""
          createdMs: now()
          grantsJson: "[]"
          displayName: My Files
        schemaId: $schema:handoff_nodes
        condition: steps.rootGate.shouldCreate
    - id: resolveRootShape
      name: resolveRootShape
      handler: function_handler
      code: ./resolveRootShape.fn.js
    - id: folder
      name: folder
      handler: data_query
      config:
        recordId: steps.resolveRootShape.effectiveFolderId
        schemaId: $schema:handoff_nodes
        condition: steps.resolveRootShape.effectiveFolderId
    - id: check
      name: check
      handler: function_handler
      code: ./check.fn.js
    - id: create
      name: create
      handler: data_create
      config:
        fields:
          folderId: steps.resolveRootShape.effectiveFolderId
          createdBy: user.id
          createdMs: request.body.createdMs
          expiresMs: request.body.expiresMs
        schemaId: $schema:handoff_share_links
        condition: steps.check.allowed
    - id: shape
      name: shape
      handler: function_handler
      code: ./shape.fn.js
    - id: ok
      name: ok
      handler: response_handler
      config:
        body: "{{{steps.shape.link}}}"
        status: 200
        condition: steps.check.allowed
        contentType: application/json
    - id: denied
      name: denied
      handler: response_handler
      config:
        body: '{"error":"forbidden"}'
        status: 403
        condition: steps.check.denied
        contentType: application/json
  validators:
    - type: auth_required
      config:
        allowApiKey: true
description: Mint a folder-scoped View-only share link (owner/admin)
