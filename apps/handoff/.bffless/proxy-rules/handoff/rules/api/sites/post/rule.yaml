targetUrl: pipeline
order: 9
pipeline:
  name: Handoff register site
  description: Create a site node at its content path prefix (storage_path = owner/repo/uploads/content/<path>; url = the Entry's content URL) and return the shaped Node. No manifest — assets serve by path passthrough on the unified content endpoint (structural storage). Rejects (409) a name that duplicates an existing sibling in the target Folder (in-Folder uniqueness).
  steps:
    - id: pre
      name: pre
      handler: function_handler
      code: ./pre.fn.ts
    - id: sibling
      name: sibling
      handler: data_query
      config:
        filters:
          parentId:
            op: eq
            value: request.body.parentId
        pageSize: 500
        schemaId: $schema:handoff_nodes
        condition: steps.pre.check
    - id: guard
      name: guard
      handler: function_handler
      code: ./guard.fn.ts
    - id: build
      name: build
      handler: function_handler
      code: ./build.fn.ts
    - id: create
      name: create
      handler: data_create
      config:
        fields:
          url: steps.build.url
          mode: "'inheriting'"
          ownerId: user.id
          nodeType: "'site'"
          parentId: request.body.parentId
          createdMs: request.body.createdMs
          siteEntry: steps.build.entry
          displayName: request.body.name
          storage_path: steps.build.storagePrefix
        schemaId: $schema:handoff_nodes
        condition: steps.guard.ok
    - id: shape
      name: shape
      handler: function_handler
      code: ./shape.fn.ts
      config:
        condition: steps.guard.ok
    - id: response
      name: response
      handler: response_handler
      config:
        body: '{"node": {{{steps.shape.node}}}}'
        status: 200
        condition: steps.guard.ok
        contentType: application/json
    - id: conflict
      name: conflict
      handler: response_handler
      config:
        body: '{"error":"An item with that name already exists in this folder. Rename it and try again."}'
        status: 409
        condition: steps.guard.collision
        contentType: application/json
description: Register a Site node at its content path prefix, no manifest (structural storage)
