name: Deploy Handoff to BFFless

# TEMPLATE — this file deliberately lives OUTSIDE .github/workflows/, so GitHub never
# runs it in this repo. Upstream (bffless/apps) no longer ships Handoff to a live
# instance: Handoff is installed from the BFFless app catalog (1-click), and this repo
# only builds + releases the install bundle (release.yml → app-bundles.yml). Reader and
# Studio still have live deploy workflows; Handoff's was retired on 2026-08-07.
#
# It is kept because it is Handoff's `eject` target (apps/handoff/bffless-app.json →
# eject.deployWorkflow): once you've installed Handoff and want to take over deploys
# from your own fork, copy this file to .github/workflows/deploy-handoff.yml there.
#
# To use it in a fork:
#   1. cp apps/handoff/bffless/deploy-handoff.yml .github/workflows/
#   2. set the BFFLESS_URL + BFFLESS_PROJECT repo variables and the BFFLESS_API_KEY secret
#   3. push — it deploys on merges to main and on `bapps-**` branches, or by hand from
#      the Actions tab (workflow_dispatch). All runs target the `handoff` alias, so the
#      first deploy lands on the alias your 1-click install already created.
on:
  push:
    branches: [main, 'bapps-**']
    paths:
      - 'apps/handoff/**'
      - '.github/workflows/deploy-handoff.yml'
  workflow_dispatch:

concurrency:
  group: deploy-handoff
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter handoff build

      - name: Run unit tests
        run: pnpm --filter handoff test:run

      # The rule handlers are .fn.ts, but the rule compiler bundles them with esbuild, which only
      # STRIPS types — it never checks them. Without this step a genuine type error would sail
      # through the sync and into production. Runs before the sync, so it can stop it.
      - name: Typecheck proxy-rule handlers
        run: pnpm --filter handoff typecheck:rules

      # Sync BEFORE the upload, so the build never goes live against rules that
      # don't exist yet. Requires CE >= 0.2.0 on the instance.
      - name: Sync proxy rules to BFFless
        uses: bffless/deploy-proxy-rules@v1
        with:
          # Handoff's backend is two sets on one alias: the app API, and the public
          # folder feeds (kept separate so the feeds can be attached on their own).
          path: |
            apps/handoff/.bffless/proxy-rules/handoff
            apps/handoff/.bffless/proxy-rules/handoff-rss-feed
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          # Empty var → action falls back to .bffless/config.json's `bffless/apps`;
          # forkers set this repo var to target their own project.
          project: ${{ vars.BFFLESS_PROJECT }}
          summary-title: Handoff Proxy Rules

      - name: Deploy to BFFless
        uses: bffless/upload-artifact@v1
        with:
          path: apps/handoff/dist
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
          alias: handoff
          # Attach the Handoff backend (presigned uploads, node tree, serving,
          # ACL, grants, share links) + the public folder feeds.
          proxy-rule-set-names: handoff,handoff-rss-feed
