targetUrl: ""
order: 59
timeout: 120000
pipeline:
  name: Server video concat (ffmpeg, async)
  description: "parts (uploaded clip serve URLs, in order) -> ENQUEUE a job (kind 'video-concat'); the ffmpeg concat op (stream-copy-first stitch) runs in postSteps reading and writing the bucket directly. Result { url } polled via /api/studio/job. Mirrors /api/transcribe. Optional body `executor: 'local'|'remote'` forces the CE executor (Remote executor, CE >= 0.4.31); omitted ⇒ instance default."
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: createJob
      name: createJob
      handler: data_create
      config:
        fields:
          kind: "'video-concat'"
          status: "'pending'"
          request: request.body
        schemaId: $schema:studio_jobs
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: |-
          {
            "jobId": "{{steps.createJob.id}}",
            "status": "pending"
          }
        status: 200
        contentType: application/json
  postSteps:
    - id: setRunning
      name: setRunning
      handler: data_update
      config:
        fields:
          status: "'running'"
        recordId: steps.createJob.id
        schemaId: $schema:studio_jobs
    - id: stitch
      name: stitch
      handler: ffmpeg_handler
      config:
        operation: concat
        # Which CE executor runs this job (CE >= 0.4.31: 'local' | 'remote'; template-evaluated).
        # Empty string ⇒ CE's configured default (its selector does `requested?.trim() || default`),
        # so clients that omit `executor` behave exactly as before. Older CE ignores the key.
        executor: "{{steps.prep.executor}}"
        inputs: steps.prep.parts
        output: "projects/{{steps.prep.projectId}}/export/server/{{uuid()}}.mp4"
    - id: check
      name: check
      handler: function_handler
      code: ./check.fn.js
    - id: finishOk
      name: finishOk
      handler: data_update
      config:
        fields:
          result: steps.check.data
          status: "'done'"
        recordId: steps.createJob.id
        schemaId: $schema:studio_jobs
        condition: steps.check.ok
    - id: finishErr
      name: finishErr
      handler: data_update
      config:
        fields:
          error: steps.check.error
          status: "'error'"
        recordId: steps.createJob.id
        schemaId: $schema:studio_jobs
        condition: steps.check.notOk
  validators: []
description: "Server-side clip stitching (stream-copy-first concat) via CE's ffmpeg_handler (>= 0.4.25). No secrets. No validators yet (auth deferred to story 07, mirrors the set)."
