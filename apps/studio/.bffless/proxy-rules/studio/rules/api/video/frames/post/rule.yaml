targetUrl: ""
order: 61
timeout: 120000
pipeline:
  name: Server frame grabs (ffmpeg frames, async)
  description: "POST { sourceUrl, projectId, times, height ∈ {180, 720, 1080}, executor? } -> ENQUEUE a job (kind 'video-frames'); CE's ffmpeg `frames` op (CE >= 0.4.35) grabs one clean still per `times` entry at `height` px. Result { frames: [{ time, url }] } in request order, polled via /api/studio/job. Scene card thumbs, blog images and the blog re-frame strip."
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: refuse
      name: refuse
      handler: response_handler
      config:
        condition: steps.prep.notOk
        body: "{{{steps.prep.failJson}}}"
        status: 400
        contentType: application/json
    - id: createJob
      name: createJob
      handler: data_create
      config:
        condition: steps.prep.ok
        fields:
          kind: "'video-frames'"
          status: "'pending'"
          request: request.body
        schemaId: $schema:studio_jobs
    - id: respond
      name: respond
      handler: response_handler
      config:
        condition: steps.prep.ok
        body: |-
          {
            "jobId": "{{steps.createJob.id}}",
            "status": "pending"
          }
        status: 200
        contentType: application/json
  postSteps:
    - id: setRunning
      name: setRunning
      handler: data_update
      config:
        condition: steps.prep.ok
        fields:
          status: "'running'"
        recordId: steps.createJob.id
        schemaId: $schema:studio_jobs
    # CE does not template ffmpeg_handler's numeric knobs (height goes straight to
    # Number(), so "{{steps.prep.height}}" is NaN and the job fails). A height must be
    # a literal, so there is one step per allowed size, picked by prep's h180/h720/h1080.
    - id: frames180
      name: frames180
      handler: ffmpeg_handler
      config:
        condition: steps.prep.h180
        operation: frames
        executor: "{{steps.prep.executor}}"
        input: "{{steps.prep.input}}"
        outputPrefix: "projects/{{steps.prep.projectId}}/frames/server/{{uuid()}}"
        times: steps.prep.times
        height: 180
    - id: frames720
      name: frames720
      handler: ffmpeg_handler
      config:
        condition: steps.prep.h720
        operation: frames
        executor: "{{steps.prep.executor}}"
        input: "{{steps.prep.input}}"
        outputPrefix: "projects/{{steps.prep.projectId}}/frames/server/{{uuid()}}"
        times: steps.prep.times
        height: 720
    - id: frames1080
      name: frames1080
      handler: ffmpeg_handler
      config:
        condition: steps.prep.h1080
        operation: frames
        executor: "{{steps.prep.executor}}"
        input: "{{steps.prep.input}}"
        outputPrefix: "projects/{{steps.prep.projectId}}/frames/server/{{uuid()}}"
        times: steps.prep.times
        height: 1080
    - id: check
      name: check
      handler: function_handler
      code: ./check.fn.js
      config:
        condition: steps.prep.ok
    - id: finishOk
      name: finishOk
      handler: data_update
      config:
        fields:
          result: steps.check.data
          status: "'done'"
        recordId: steps.createJob.id
        schemaId: $schema:studio_jobs
        condition: steps.check.ok
    - id: finishErr
      name: finishErr
      handler: data_update
      config:
        fields:
          error: steps.check.error
          status: "'error'"
        recordId: steps.createJob.id
        schemaId: $schema:studio_jobs
        condition: steps.check.notOk
  validators: []
description: "Server-side still frames via CE's ffmpeg_handler `frames` op (CE >= 0.4.35), no draw and no tile. One source per job. No secrets."
