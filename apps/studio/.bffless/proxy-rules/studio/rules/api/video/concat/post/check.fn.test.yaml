handler: ./check.fn.js
cases:
  - name: maps storage_path to a serve URL
    data:
      steps:
        stitch:
          storage_path: o/r/uploads/projects/p1/export/server/s.mp4
          content_type: video/mp4
          size: 789
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        data: { url: /api/uploads/projects/p1/export/server/s.mp4 }
  - name: missing step output is a failure
    data:
      steps: {}
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: Server stitch failed
        data: null
  - name: a failed step's code + message are carried into the job error when CE exposes them (ce#662)
    data:
      steps: {}
      stepErrors:
        stitch: { code: FFMPEG_BUSY, message: "remote in-flight limit reached (8)" }
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: "Server stitch failed (FFMPEG_BUSY: remote in-flight limit reached (8))"
        data: null
