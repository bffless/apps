targetUrl: pipeline
order: 27
timeout: 120000
pipeline:
  name: Export description (sync Claude + skill)
  description: One sync Claude completion (ai_handler, no chat/history) that writes { title, summary } from the final kept script + director synopsis. Loads the `video-description` skill (creator voice, canonical product spellings, YouTube formatting) when the project's Skills Path points at apps/studio/dist/bffless/skills; the system prompt's defaults are complete on their own when it doesn't.
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: describe
      name: describe
      handler: ai_handler
      config:
        mode: completion
        model: claude-opus-4-6
        skills:
          mode: selected
          path: apps/studio/dist/bffless/skills
          enabled:
            - video-description
        provider: anthropic
        maxTokens: 2000
        temperature: 0.3
        timeout: 110000
        messageField: "{{steps.prep.prompt}}"
        responseMode: message
        systemPrompt: "{{steps.prep.system}}"
    - id: parse
      name: parse
      handler: function_handler
      code: ./parse.fn.js
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: "{{{steps.parse.descriptionJson}}}"
        status: 200
        contentType: application/json
  validators: []
description: "Export description (sync Claude + video-description skill): final kept script + director synopsis -> { title, summary }. One-shot completion, not a chat. Point the step's Skills at your own description skill to override the house style."
