targetUrl: pipeline
order: 51
timeout: 120000
pipeline:
  name: thumbnail-render
  description: Render a YouTube thumbnail with google/nano-banana from the edited prompt, optionally built around an uploaded reference image; store to projects/<id>/youtube-thumbnail; return { imageUrl } serve path (re-signed client-side via /api/uploads/sign).
  steps:
    - id: prepImages
      name: prepImages
      handler: function_handler
      code: ./prepImages.fn.js
    - id: generate
      name: generate
      handler: replicate
      config:
        input:
          prompt: request.body.prompt
          aspect_ratio: "'16:9'"
          # Optional reference image(s) — an `/api/uploads/...` serve path the
          # replicate handler resolves from storage. Empty array = none.
          image_input: steps.prepImages.images
        model: google/nano-banana-2
        timeout: 110000
    - id: pickUrl
      name: pickUrl
      handler: function_handler
      code: ./pickUrl.fn.js
    - id: store
      name: store
      handler: file_upload_handler
      config:
        subDir: projects/{{request.body.projectId}}/youtube-thumbnail
        schemaId: $schema:youtube_thumbnail
        sourceUrl: steps.pickUrl.url
        allowedMimeTypes:
          - image/*
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: '{"imageUrl": "{{steps.store.url}}"}'
        status: 200
        contentType: application/json
  validators: []
description: "Studio thumbnail: render the (edited) prompt with google/nano-banana, optionally around an uploaded reference image (referenceImageUrl), store to the bucket under the project, return { imageUrl } serve path. Needs the project Replicate token. Story 06."
