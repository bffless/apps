targetUrl: pipeline
order: 5
pipeline:
  name: Register studio_audio upload
  description: Verify the bucket object and write the upload record (finalize step of the direct-to-bucket audio flow). Reuses the studio_source schema; the audio/ subDir distinguishes records.
  steps:
    - id: register
      name: register
      handler: register_upload
      config:
        subDir: projects/{{request.body.projectId}}/audio
        schemaId: $schema:studio_source
        storageKey: request.body.storageKey
        maxFileSize: 2147483648
        originalName: request.body.originalName
        allowedMimeTypes:
          - audio/*
    - id: response
      name: Return Register Result
      handler: response_handler
      config:
        body: "{{{steps.register}}}"
        status: 200
        contentType: application/json
  validators: []
description: "Register: finalize a direct-to-bucket studio audio upload into studio_source"
