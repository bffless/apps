targetUrl: pipeline
order: 12
pipeline:
  name: Prepare studio voice upload
  description: Mint a presigned PUT URL so the browser uploads the recorded voice-clone sample straight to the bucket (audio/*).
  steps:
    - id: prepare
      name: prepare
      handler: presigned_upload
      config:
        subDir: projects/{{request.body.projectId}}/voice
        filename: request.body.filename
        expiresIn: 3600
        dateBucket: true
        maxFileSize: 2147483648
        allowedMimeTypes:
          - audio/*
    - id: response
      name: Return Prepare Result
      handler: response_handler
      config:
        body: "{{{steps.prepare}}}"
        status: 200
        contentType: application/json
  validators: []
description: "Prepare: mint presigned PUT URL for direct-to-bucket studio voice (clone sample) upload. auth_required deferred to story 07 (mirrors source/audio/thumbnails)."
