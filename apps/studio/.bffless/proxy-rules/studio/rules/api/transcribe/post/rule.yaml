targetUrl: ""
order: 7
timeout: 120000
pipeline:
  name: Transcribe audio (WhisperX, async)
  description: audioUrl (already in bucket) -> ENQUEUE a job (kind 'transcribe') and return its id; the WhisperX call (+ optional pyannote diarization when request.body.diarize) runs in postSteps so it can't hit the 30s edge timeout. Flattened { words, text } (each word carries a speaker when diarized) lands in the job row's result, polled via /api/studio/job. Story 10e.
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: createJob
      name: createJob
      handler: data_create
      config:
        fields:
          kind: "'transcribe'"
          status: "'pending'"
          request: request.body
        schemaId: $schema:studio_jobs
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: |-
          {
            "jobId": "{{steps.createJob.id}}",
            "status": "pending"
          }
        status: 200
        contentType: application/json
  postSteps:
    - id: setRunning
      name: setRunning
      handler: data_update
      config:
        fields:
          status: "'running'"
        recordId: steps.createJob.id
        schemaId: $schema:studio_jobs
    - id: sign
      name: sign
      handler: signed_url
      config:
        path: steps.prep.storagePath
        expiresIn: 3600
    - id: whisper
      name: whisper
      handler: replicate
      config:
        input:
          debug: false
          audio_file: steps.sign.url
          batch_size: 64
          diarization: steps.prep.diarize
          temperature: 0
          align_output: true
          huggingface_access_token: secrets.HF_TOKEN
        model: victor-upmeet/whisperx
        timeout: 280000
        version: 655845d6190ef70573c669245f245892cd039df4b880a1e3a65852c09252f5cc
    - id: flatten
      name: flatten
      handler: function_handler
      code: ./flatten.fn.js
    - id: check
      name: check
      handler: function_handler
      code: ./check.fn.js
    - id: finishOk
      name: finishOk
      handler: data_update
      config:
        fields:
          result: steps.check.data
          status: "'done'"
        recordId: steps.createJob.id
        schemaId: $schema:studio_jobs
        condition: steps.check.ok
    - id: finishErr
      name: finishErr
      handler: data_update
      config:
        fields:
          error: steps.check.error
          status: "'error'"
        recordId: steps.createJob.id
        schemaId: $schema:studio_jobs
        condition: steps.check.notOk
  validators: []
description: "Transcribe an already-uploaded WAV with word-level timestamps. Mints a presigned GCS download URL for the audio (already in the bucket) and hands it to Replicate WhisperX (align_output:true), then flattens segments to { words: [{text,start,end}], text }. No validators yet — auth_required + rate_limit deferred to story 07 (mirrors the upload rules), so local unauthenticated dev works."
