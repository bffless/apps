handler: ./prep.fn.js
cases:
  - name: shifts each source onto one global clock, signs the sheets and keeps the director prompt verbatim
    data:
      request:
        body:
          timed:
            - "[0:00] one two"
            - "[0:00] three\n[0:08] four"
          sheets:
            - ["workflows/run-1/v0/sheets/sheet-01.jpg"]
            - ["workflows/run-1/v1/sheets/sheet-01.jpg"]
          durations: [13, 8]
          sources:
            - workflows/run-1/v0/a.mp4
            - workflows/run-1/v1/b.mp4
          direction: punchy
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        path0: o/r/uploads/workflows/run-1/v0/sheets/sheet-01.jpg
        path1: o/r/uploads/workflows/run-1/v1/sheets/sheet-01.jpg
        path2: ""
        path3: ""
        path4: ""
        path5: ""
        path6: ""
        path7: ""
        path8: ""
        path9: ""
        sources:
          - workflows/run-1/v0/a.mp4
          - workflows/run-1/v1/b.mp4
        spans:
          - { start: 0, end: 13 }
          - { start: 13, end: 21 }
        transcript: |-
          --- VIDEO 1: a.mp4 (starts 0:00) ---
          [0:00] one two

          --- VIDEO 2: b.mp4 (starts 0:13) ---
          [0:13] three
          [0:21] four
        direction: punchy
        duration: 21
        system: |-
          You are the Master Director: an award-winning film and YouTube editor who turns long, rambling screen recordings into tight, compelling shorts.
          You are given (1) a timestamped transcript and (2) contact-sheet images: grids of frames sampled across the recording, each with its wall-clock timestamp burned into a corner. Use BOTH the words and the frames to understand what happens and when.

          THE EDIT MODEL (cut-first): the final video is the ORIGINAL recording minus CUTS, always in the speaker's own recorded voice. Nothing is rewritten, re-voiced or added - a cut (a span of footage to drop) is the only edit. You never write narration or a script.

          Your job is the BIG PICTURE only - a second-pass editor places the precise cuts for each scene later.
          1. Write a one-sentence SYNOPSIS (a logline) of the whole talk: punchy, like a movie one-liner.
          2. TILE the recording into logical SCENES (chapters), roughly 2-5 minutes each. Never split a strong continuous run just to hit a number. Give each a short chapter TITLE. Scenes MUST tile the recording exactly: the first scene starts at 0, each scene starts exactly where the previous one ends, and the last scene ends at the full duration. Every second of footage belongs to exactly one scene - footage is only ever dropped by a cut, never by leaving it outside the scenes.
          3. For EACH scene write a CUTTING BRIEF (brief): one to three sentences of prose instructions to the second-pass editor who will place the precise cuts inside THIS scene. Say what to drop and why - false starts, repeated takes, tangents, long dead air - grounded in what you saw across the WHOLE recording (e.g. "the demo is re-attempted here; keep only the second take"), plus the pacing to aim for and anything on-screen to preserve. Guidance in words, not spans - do NOT restate exact timestamps you already give as cuts, and do NOT write narration.
          4. For EACH scene give the obvious footage spans to CUT within it (cuts: array of {start,end} in seconds) - clear dead air, tangents, false starts, repeated takes. This is the coarse baseline; the result must already be watchable. Mark only a few LARGER spans worth removing; do not place cuts close together or slice out many tiny fragments - leaving a little dead space is better than a choppy, over-cut result. The second-pass editor refines these.

          Rules for timestamps: all values are SECONDS from the start of the recording. For every scene start < end. Scenes are ordered earliest-first, must NOT overlap and must NOT leave gaps (each start equals the previous end; the first start is 0; the last end is the full duration). Every cut lies inside its own scene [start,end]. Use the transcript timestamps and the frame timestamps to be accurate.

          MULTI-VIDEO: if the transcript contains "--- VIDEO n: ... ---" boundary markers, it is several source recordings concatenated onto one timeline. Put a scene boundary exactly at every video boundary - a scene must NEVER start in one video and end in another.

          Output STRICT JSON only - no markdown fences, no commentary - exactly this shape:
          {"synopsis": string, "scenes": [{"title": string, "start": number, "end": number, "brief": string, "cuts": [{"start": number, "end": number}]}]}
          Do NOT include a transcript, script, narration or voicing field. Return nothing but the JSON object.
        prompt: |-
          TIMESTAMPED TRANSCRIPT (each line starts with its [m:ss] time):

          --- VIDEO 1: a.mp4 (starts 0:00) ---
          [0:00] one two

          --- VIDEO 2: b.mp4 (starts 0:13) ---
          [0:13] three
          [0:21] four

          The full recording is 21 seconds long. The attached images are the contact sheets described in your instructions.

          EXTRA DIRECTION FROM THE CREATOR (weight this heavily): punchy

          Now produce the synopsis and the scene breakdown as STRICT JSON exactly as specified. Return nothing but the JSON object.
  - name: refuses a sheet path outside the run prefix
    data:
      request:
        body:
          timed: ["[0:00] one"]
          sheets: [["projects/p1/sheets/sheet-01.jpg"]]
          durations: [12]
          sources: ["workflows/run-1/v0/a.mp4"]
          direction: ""
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: Refused - every path must be an uploads-relative path under workflows/
        path0: ""
        path1: ""
        path2: ""
        path3: ""
        path4: ""
        path5: ""
        path6: ""
        path7: ""
        path8: ""
        path9: ""
        sources: []
        spans: []
        transcript: ""
        direction: ""
        duration: 0
        system: ""
        prompt: ""
