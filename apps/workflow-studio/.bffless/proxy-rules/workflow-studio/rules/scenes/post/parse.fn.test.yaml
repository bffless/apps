handler: ./parse.fn.js
cases:
  - name: tiles the global timeline, assigns each scene to its source and localises it
    data:
      steps:
        prep:
          sources:
            - workflows/run-1/v0/a.mp4
            - workflows/run-1/v1/b.mp4
          spans:
            - { start: 0, end: 12 }
            - { start: 12, end: 20 }
        director:
          output: '{"synopsis":"A talk.","scenes":[{"title":"Intro","start":0,"end":12,"brief":"cut the ums","cuts":[{"start":2,"end":4}]},{"title":"Demo","start":12,"end":20,"brief":"keep take 2","cuts":[]}]}'
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          synopsis: A talk.
          scenes:
            - number: 1
              title: Intro
              brief: cut the ums
              source: workflows/run-1/v0/a.mp4
              sourceIndex: 0
              start: 0
              end: 12
              spans: [{ start: 0, end: 12 }]
              cuts: [{ start: 2, end: 4 }]
            - number: 2
              title: Demo
              brief: keep take 2
              source: workflows/run-1/v1/b.mp4
              sourceIndex: 1
              start: 0
              end: 8
              spans: [{ start: 0, end: 8 }]
              cuts: []
  - name: re-tiles each source's local timeline when a scene crosses a source boundary
    # Intro runs 0..14 on the global timeline: dominant on source 0 (overlap 12 vs 2), so
    # stage 2 keeps only its source-0 side and orphans the head of source 1. Stage 3 snaps
    # Demo (local 2..8 on source 1) back to 0 and, being the last scene on that source, to
    # the source's duration - the rows come out as if the director had split at 12. A cut
    # entirely inside the dropped side (13..14 on Intro) is clamped away; Demo's cut at
    # global 15..17 lands at local 3..5.
    data:
      steps:
        prep:
          sources:
            - workflows/run-1/v0/a.mp4
            - workflows/run-1/v1/b.mp4
          spans:
            - { start: 0, end: 12 }
            - { start: 12, end: 20 }
        director:
          output: '{"synopsis":"A talk.","scenes":[{"title":"Intro","start":0,"end":14,"brief":"cut the ums","cuts":[{"start":2,"end":4},{"start":13,"end":14}]},{"title":"Demo","start":14,"end":20,"brief":"keep take 2","cuts":[{"start":15,"end":17}]}]}'
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          synopsis: A talk.
          scenes:
            - number: 1
              title: Intro
              brief: cut the ums
              source: workflows/run-1/v0/a.mp4
              sourceIndex: 0
              start: 0
              end: 12
              spans: [{ start: 0, end: 12 }]
              cuts: [{ start: 2, end: 4 }]
            - number: 2
              title: Demo
              brief: keep take 2
              source: workflows/run-1/v1/b.mp4
              sourceIndex: 1
              start: 0
              end: 8
              spans: [{ start: 0, end: 8 }]
              cuts: [{ start: 3, end: 5 }]
  - name: salvages the complete scenes and the synopsis from a truncated document
    # The output stops mid-string inside the second scene, so the whole-document parse
    # fails and the salvage path recovers every scene object that closed, plus the
    # synopsis. The one salvaged scene then tiles to the full recording.
    data:
      steps:
        prep:
          sources: ["workflows/run-1/v0/a.mp4"]
          spans: [{ start: 0, end: 12 }]
        director:
          output: '{"synopsis":"A talk.","scenes":[{"title":"Intro","start":0,"end":12,"brief":"cut the ums","cuts":[{"start":2,"end":4}]},{"title":"Demo","start":12,"end":20,"brief":"keep ta'
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          synopsis: A talk.
          scenes:
            - number: 1
              title: Intro
              brief: cut the ums
              source: workflows/run-1/v0/a.mp4
              sourceIndex: 0
              start: 0
              end: 12
              spans: [{ start: 0, end: 12 }]
              cuts: [{ start: 2, end: 4 }]
  - name: a document with no scenes is a failure carrying what the model said
    data:
      steps:
        prep:
          sources: ["workflows/run-1/v0/a.mp4"]
          spans: [{ start: 0, end: 12 }]
        director:
          output: '{"synopsis":"A talk.","scenes":[]}'
    expect:
      result:
        ok: false
        notOk: true
        error: "The AI director's response could not be read. Please try again. Model said: {\"synopsis\":\"A talk.\",\"scenes\":[]}"
        code: ""
        data: { synopsis: "", scenes: [] }
  - name: an empty output string is a failure with nothing to echo back
    data:
      steps:
        prep:
          sources: ["workflows/run-1/v0/a.mp4"]
          spans: [{ start: 0, end: 12 }]
        director:
          output: ""
    expect:
      result:
        ok: false
        notOk: true
        error: The AI director returned an empty response - it may be temporarily overloaded. Please try again.
        code: ""
        data: { synopsis: "", scenes: [] }
  - name: no source spans to place the scenes against is a failure
    data:
      steps:
        prep:
          sources: ["workflows/run-1/v0/a.mp4"]
          spans: []
        director:
          output: '{"synopsis":"A talk.","scenes":[{"title":"Intro","start":0,"end":12,"brief":"","cuts":[]}]}'
    expect:
      result:
        ok: false
        notOk: true
        error: No source recordings to place the scenes against.
        code: ""
        data: { synopsis: "", scenes: [] }
  - name: scenes that overlap no recording by more than the sliver threshold are a failure
    # Tiling always covers 0..bound, so the only way for a scene to win no assignment is a
    # recording narrower than the 0.05s sliver threshold: the best overlap is 0.04 and every
    # scene is skipped.
    data:
      steps:
        prep:
          sources: ["workflows/run-1/v0/a.mp4"]
          spans: [{ start: 0, end: 0.04 }]
        director:
          output: '{"synopsis":"A talk.","scenes":[{"title":"Intro","start":0,"end":12,"brief":"","cuts":[]}]}'
    expect:
      result:
        ok: false
        notOk: true
        error: None of the scenes the AI director returned overlap the recordings. Please try again.
        code: ""
        data: { synopsis: "", scenes: [] }
  - name: no director output at all is a failure
    data:
      steps:
        prep:
          sources: ["workflows/run-1/v0/a.mp4"]
          spans: [{ start: 0, end: 12 }]
        director: {}
    expect:
      result:
        ok: false
        notOk: true
        error: The AI director did not return a result - it may be temporarily overloaded, or the video may be too long. Please try again.
        code: ""
        data: { synopsis: "", scenes: [] }
  # NOTE: no `stepErrors` case — the CLI fixture schema rejects that data root (see
  # video/extract-audio/post/check.fn.test.yaml).
