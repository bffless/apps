handler: ./sweep.fn.js
cases:
  - name: prep ok but no parse output means parse threw - the job is stuck
    data:
      steps:
        prep: { ok: true, notOk: false }
        createJob: { id: job-1 }
    expect:
      result:
        stuck: true
        message: "Job step 'parse' threw and wrote no output"
  - name: a parse output, ok or not, was handled by finishOk/finishErr
    data:
      steps:
        prep: { ok: true, notOk: false }
        createJob: { id: job-1 }
        parse: { ok: false, notOk: true, error: something failed, code: "" }
    expect:
      result:
        stuck: false
        message: ""
  - name: a refused request never ran parse and has no job row - not stuck
    data:
      steps:
        prep: { ok: false, notOk: true, error: bad path }
    expect:
      result:
        stuck: false
        message: ""
  # NOTE: a case feeding `stepErrors` (the ce#662 forward-compat read that fills the
  # message's detail) is omitted: the bffless CLI's fixture schema accepts only
  # user/request/steps/deployment as data roots - the same gap check.fn.test.yaml documents.
