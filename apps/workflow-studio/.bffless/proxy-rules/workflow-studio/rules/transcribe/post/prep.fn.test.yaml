handler: ./prep.fn.js
cases:
  - name: turns the uploads-relative wav into the storage path the signer wants
    data:
      request:
        body:
          audio: workflows/run-1/audio/audio.wav
          diarize: false
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        storagePath: o/r/uploads/workflows/run-1/audio/audio.wav
        diarize: false
        language: null
  - name: refuses an audio path outside the run prefix
    data:
      request:
        body:
          audio: projects/p1/audio/a.wav
          diarize: true
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: Refused - every path must be an uploads-relative path under workflows/
        storagePath: ""
        diarize: false
        language: null
  - name: passes a pinned ISO language code through to WhisperX, lower-cased
    data:
      request:
        body:
          audio: workflows/run-1/audio/audio.wav
          language: "EN"
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        storagePath: o/r/uploads/workflows/run-1/audio/audio.wav
        diarize: false
        language: en
  - name: "'auto' (the kickoff's auto-detect choice) becomes null, which WhisperX reads as detect"
    data:
      request:
        body:
          audio: workflows/run-1/audio/audio.wav
          language: auto
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        storagePath: o/r/uploads/workflows/run-1/audio/audio.wav
        diarize: false
        language: null
  - name: refuses a language that is not an ISO code before a job row is created
    data:
      request:
        body:
          audio: workflows/run-1/audio/audio.wav
          language: "english; DROP"
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: "Refused - language must be an ISO 639 code such as en, or auto"
        storagePath: ""
        diarize: false
        language: null
