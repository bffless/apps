handler: ./flatten.fn.js
cases:
  - name: flattens WhisperX segments and buckets them into 8-second lines
    data:
      steps:
        whisper:
          output:
            segments:
              - text: " Hello world"
                words:
                  - { word: Hello, start: 0.5, end: 0.9 }
                  - { word: world, start: 1.2, end: 1.7 }
              - text: " again later"
                words:
                  - { word: again, start: 9, end: 9.4 }
                  - { word: later, start: 9.6, end: 10.2512 }
    expect:
      result:
        words:
          - { text: Hello, start: 0.5, end: 0.9, speaker: null }
          - { text: world, start: 1.2, end: 1.7, speaker: null }
          - { text: again, start: 9, end: 9.4, speaker: null }
          - { text: later, start: 9.6, end: 10.2512, speaker: null }
        text: Hello world again later
        timed: "[0:00] Hello world\n[0:08] again later"
        duration: 10.251
  - name: no segments yields empty everything
    data:
      steps:
        whisper: { output: { segments: [] } }
    expect:
      result:
        words: []
        text: ""
        timed: ""
        duration: 0
