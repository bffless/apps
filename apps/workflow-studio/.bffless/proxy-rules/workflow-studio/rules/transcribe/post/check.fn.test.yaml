handler: ./check.fn.js
cases:
  - name: carries words, text, the bucketed transcript and the duration
    data:
      steps:
        flatten:
          words: [{ text: Hello, start: 0, end: 0.4, speaker: null }]
          text: Hello
          timed: "[0:00] Hello"
          duration: 0.4
          language: en
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          words: [{ text: Hello, start: 0, end: 0.4, speaker: null }]
          text: Hello
          timed: "[0:00] Hello"
          duration: 0.4
          language: en
  - name: text without a single word timing is a failure, naming the language WhisperX could not align
    data:
      steps:
        flatten:
          words: []
          text: Helo, bawb
          timed: ""
          duration: 0
          language: cy
    expect:
      result:
        ok: false
        notOk: true
        error: "Transcription came back without word timings: WhisperX heard the recording as 'cy', which it cannot align. Pick the spoken language at kickoff instead of auto-detect."
        code: UNALIGNED_TRANSCRIPT
        data: null
  - name: a silent recording (no text, no words) is not a failure - downstream says so
    data:
      steps:
        flatten:
          words: []
          text: ""
          timed: ""
          duration: 0
          language: en
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          words: []
          text: ""
          timed: ""
          duration: 0
          language: en
  - name: a missing flatten output is a failure
    data:
      steps: {}
    expect:
      result:
        ok: false
        notOk: true
        error: Transcription failed
        code: ""
        data: null
  # NOTE: no `stepErrors` case — the CLI fixture schema rejects that data root (see
  # video/extract-audio/post/check.fn.test.yaml).
