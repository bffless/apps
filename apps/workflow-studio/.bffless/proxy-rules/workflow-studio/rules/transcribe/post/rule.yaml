targetUrl: pipeline
timeout: 120000
pipeline:
  name: Transcribe audio (WhisperX, async)
  description: "POST { audio, diarize } -> ENQUEUE a job (kind 'transcribe') and return { jobId, status: 'pending' }; the WhisperX call (+ optional pyannote diarization) runs in postSteps so it can't hit the edge timeout. Result { words, text, timed, duration } is polled via GET job?id=. Ported from apps/studio /api/transcribe: `audio` is the uploads-relative path the extract step returned (not a URL), and flatten additionally computes the 8-second `[m:ss]` bucketing and the duration the later steps bound on (R126)."
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: refuse
      name: refuse
      handler: response_handler
      config:
        condition: steps.prep.notOk
        body: |-
          {
            "error": "{{steps.prep.error}}",
            "code": "BAD_REQUEST"
          }
        status: 400
        contentType: application/json
    - id: createJob
      name: createJob
      handler: data_create
      config:
        condition: steps.prep.ok
        fields:
          kind: "'transcribe'"
          status: "'pending'"
          request: request.body
        schemaId: $schema:workflow_studio_jobs
    - id: respond
      name: respond
      handler: response_handler
      config:
        condition: steps.prep.ok
        body: |-
          {
            "jobId": "{{steps.createJob.id}}",
            "status": "pending"
          }
        status: 200
        contentType: application/json
  # Every postStep is gated on `steps.prep.ok`. A response_handler does NOT terminate a CE
  # pipeline - of the handlers that can, file-serve / stripe-webhook / form always set
  # `terminates` and ai_handler ONLY in `stream` mode (CE ai.handler.ts:665; every ai_handler
  # step in this set uses responseMode: message, so none of them terminate) - so postSteps
  # still fire after the `refuse` branch has answered 400 - ungated, a refused request would
  # run the paid work anyway. finishOk/finishErr need no gate of their own: with `check`
  # skipped, `steps.check.ok` resolves to null (a missing key returns null, it does not
  # throw) and both branches stay off.
  # The ONE ungated postStep is `sweep`, the last one. A step that THROWS writes nothing to
  # `steps` and CE's runPostSteps logs it and carries on to the next step, so with `check`
  # thrown `steps.check.ok` and `.notOk` both resolve to null, neither finish branch fires
  # and the row would sit `running` until the workflow's poll timeout. `sweep` folds
  # `steps.prep.ok` in itself (a condition is a simple path, and a refused request has no
  # job row to write onto) and `finishStuck` writes the row to error with code STEP_THREW,
  # which the workflow's `poll.fail` ends on at once (apps#467).
  postSteps:
    - id: setRunning
      name: setRunning
      handler: data_update
      config:
        condition: steps.prep.ok
        fields:
          status: "'running'"
        recordId: steps.createJob.id
        schemaId: $schema:workflow_studio_jobs
    - id: sign
      name: sign
      handler: signed_url
      config:
        condition: steps.prep.ok
        path: steps.prep.storagePath
        expiresIn: 3600
    - id: whisper
      name: whisper
      handler: replicate
      config:
        condition: steps.prep.ok
        input:
          debug: false
          audio_file: steps.sign.url
          batch_size: 64
          diarization: steps.prep.diarize
          temperature: 0
          align_output: true
          huggingface_access_token: secrets.HF_TOKEN
        model: victor-upmeet/whisperx
        timeout: 280000
        version: 655845d6190ef70573c669245f245892cd039df4b880a1e3a65852c09252f5cc
    - id: flatten
      name: flatten
      handler: function_handler
      code: ./flatten.fn.js
      config:
        condition: steps.prep.ok
    - id: check
      name: check
      handler: function_handler
      code: ./check.fn.js
      config:
        condition: steps.prep.ok
    - id: finishOk
      name: finishOk
      handler: data_update
      config:
        fields:
          result: steps.check.data
          status: "'done'"
        recordId: steps.createJob.id
        schemaId: $schema:workflow_studio_jobs
        condition: steps.check.ok
    - id: finishErr
      name: finishErr
      handler: data_update
      config:
        fields:
          error: steps.check.error
          code: steps.check.code
          status: "'error'"
        recordId: steps.createJob.id
        schemaId: $schema:workflow_studio_jobs
        condition: steps.check.notOk
    - id: sweep
      name: sweep
      handler: function_handler
      code: ./sweep.fn.js
    - id: finishStuck
      name: finishStuck
      handler: data_update
      config:
        fields:
          error: steps.sweep.message
          code: "'STEP_THREW'"
          status: "'error'"
        recordId: steps.createJob.id
        schemaId: $schema:workflow_studio_jobs
        condition: steps.sweep.stuck
  validators:
    - type: auth_required
      config: { allowApiKey: true }
description: "Transcribe an already-extracted WAV with word-level timestamps. Mints a presigned download URL for the audio and hands it to Replicate WhisperX (align_output:true), then flattens segments to { words, text, timed, duration }. Refuses (400) any audio path outside the harness's workflows/ run prefix before a job row is created."
