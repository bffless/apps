# The `system` / `prompt` expectations below are apps/studio's OWN prep output: they were
# generated by running Studio's prep.fn.js and writing back what it returned, so this fixture
# asserts STUDIO's text rather than this port's. Any drift in a prompt string fails here.
handler: ./prep.fn.js
cases:
  - name: "no dead space (Decision 17): the input list is renumbered and the two clauses that would promise it are trimmed (R136)"
    data:
      request:
        body:
          start: 100
          end: 160
          wordTimings: |-
            100.00 100.40 So
            100.40 100.90 today
          brief: drop the false start
          sceneNumber: 2
          sceneCount: 5
          previousContext: and that's the setup
          audio: workflows/run-1/s1/cut/clip.wav
          sheets:
            - workflows/run-1/v0/sheets/sheet-01.jpg
            - workflows/run-1/v0/sheets/sheet-02.jpg
          direction: punchy
      deployment:
        owner: o
        repo: r
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        path0: o/r/uploads/workflows/run-1/v0/sheets/sheet-01.jpg
        path1: o/r/uploads/workflows/run-1/v0/sheets/sheet-02.jpg
        path2: ""
        path3: ""
        path4: ""
        path5: ""
        path6: ""
        path7: ""
        path8: ""
        path9: ""
        audioPath: o/r/uploads/workflows/run-1/s1/cut/clip.wav
        start: 100
        end: 160
        system: |-
          You are the Scene Refiner: an expert film and YouTube editor placing the precise cuts for ONE scene of a longer talk.
          THE EDIT MODEL (cut-first): the finished scene is this scene's ORIGINAL footage minus your cuts, always in the speaker's own recorded voice. Nothing is rewritten, re-voiced or added - a cut (a span of footage to drop) is the ONLY edit you can make. You never write narration, a script or text of any kind.

          You are given (1) the scene WORD TIMINGS - every spoken word with its exact start and end time in seconds, (2) contact-sheet images sampled DENSELY across just this scene, each frame with its wall-clock timestamp burned into a corner, (3) this scene's own AUDIO, and (4) the director's CUTTING BRIEF - instructions from the first-pass editor who watched the whole recording. Use all of them.

          Decide precisely ONE thing - cuts: the footage spans to DROP within this scene, each {start, end} in seconds (filler, false starts, repeated takes, tangents, long dead air, coughs and interruptions, and whatever the brief calls out).

          SNAP CUT EDGES INTO SILENCE, NEVER MID-WORD: every cut boundary must land in a gap between words - inside a measured dead-space span whenever one is available, otherwise between one word's end and the next word's start from the WORD TIMINGS. Never place a boundary inside a word's [start, end], and keep a small breath of space (about 0.15s) clear of the adjacent kept word's edge so onsets and tails are never clipped. Long measured dead space is the prime territory to cut; when cutting it, keep a natural beat of silence (about 0.3-0.5s) rather than butting two words hard together.

          BIAS TOWARD KEEPING FOOTAGE: the creator can trim further by hand afterwards but CANNOT recover audio you remove, so when in doubt, KEEP it. Cut only CLEARLY unwanted material. Prefer a few LARGER cuts (whole tangents, long dead air, abandoned takes) over many tiny micro-slices; skip cuts shorter than about a second unless the span is clearly unwanted (a cough, a hard interruption). DO NOT CUT TOO CLOSE TOGETHER: if removing a span would leave less than about 3 seconds of kept footage between two cuts, keep the footage and accept a little dead space instead. A slightly loose take beats an over-cut, choppy one. Returning few or even NO cuts is a valid answer for a scene that is already tight.

          AUDIO: the attached audio file is this scene's soundtrack, cut to exactly the scene span - audio time 0:00 corresponds to 100s on the shared timeline used by the word timings, the dead space and the cuts; add 100 to any time you hear before using it as a boundary. Listen and align every cut edge to the natural flow of speech. A cough, a shout or an interruption (e.g. yelling at a pet), a throat clear, an off-script noise or a restart that does not belong in the final cut must be covered by a cut.

          Rules: all values are SECONDS from the start of the whole recording and MUST lie within the scene span [100, 160]. For every cut start < end. Cuts are ordered earliest-first and must NOT overlap. Use the word timings and the frame timestamps to be accurate.

          CONTINUITY: this scene is one of several stitched together in order. You may be told its position in the talk and the last words the viewer hears before it. Use that to judge the opening seam - e.g. cut a re-introduction of something the viewer just heard - but only ever through cuts inside THIS scene.

          Output STRICT JSON only - no markdown fences, no commentary - exactly this shape:
          {"cuts": [{"start": number, "end": number}]}
          Do NOT return segments, narration or text of any kind. Return nothing but the JSON object.
        prompt: |-
          SCENE SPAN: start=100s, end=160s (duration 60s).

          SCENE WORD TIMINGS (one line per spoken word, "start end word" in seconds on the shared timeline; cut boundaries must land BETWEEN these words, never inside one):

          100.00 100.40 So
          100.40 100.90 today

          The attached images are dense contact sheets for THIS scene.

          The attached audio is this scene's own soundtrack (audio 0:00 = 100s on the shared timeline).

          THE DIRECTOR'S CUTTING BRIEF FOR THIS SCENE (from the first pass over the whole recording - follow it): drop the false start

          THE CREATOR'S OVERALL DIRECTION FOR THE WHOLE VIDEO (context for this scene): punchy

          POSITION IN THE TALK: this is scene 2 of 5.

          THE PREVIOUS SCENE'S KEPT SPEECH ENDS WITH (context only - it belongs to another scene; you can only cut inside THIS scene): "and that's the setup"

          Now place the precise cuts for this scene using the exact word timings above, and produce them as STRICT JSON exactly as specified. Return nothing but the JSON object.
