handler: ./fallback.fn.js
cases:
  - name: a refiner that answered needs no deaf re-run
    data:
      steps:
        refiner: { output: '{"cuts":[]}' }
    expect:
      result:
        needsFallback: false
        heardAudio: true
  - name: an empty refiner step (the provider dropped the audio) arms the deaf re-run
    data:
      steps:
        refiner: {}
    expect:
      result:
        needsFallback: true
        heardAudio: false
  - name: a missing refiner step arms the deaf re-run too
    data:
      steps: {}
    expect:
      result:
        needsFallback: true
        heardAudio: false
