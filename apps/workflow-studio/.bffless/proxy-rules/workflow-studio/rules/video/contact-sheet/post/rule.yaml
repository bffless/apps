targetUrl: pipeline
timeout: 120000
pipeline:
  name: Director contact sheets (ffmpeg frames + tile, async)
  description: "POST { source, outPrefix, times, labels, executor } -> ENQUEUE a job (kind 'contact-sheet'); CE's ffmpeg `frames` op captures one still per `times` entry, burns the caller's parallel `labels` into each, and tiles them into contact sheets. Result { paths, times, cols, drawn } is polled via GET job?id=. There is no CE contact-sheet operation: a sheet is `times` + `tile` (R116). Studio drew these in the browser (src/lib/frames.ts); the corner, size and clock text match that."
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: refuse
      name: refuse
      handler: response_handler
      config:
        condition: steps.prep.notOk
        body: |-
          {
            "error": "{{steps.prep.error}}",
            "code": "BAD_REQUEST"
          }
        status: 400
        contentType: application/json
    - id: createJob
      name: createJob
      handler: data_create
      config:
        condition: steps.prep.ok
        fields:
          kind: "'contact-sheet'"
          status: "'pending'"
          request: request.body
        schemaId: $schema:workflow_studio_jobs
    - id: respond
      name: respond
      handler: response_handler
      config:
        condition: steps.prep.ok
        body: |-
          {
            "jobId": "{{steps.createJob.id}}",
            "status": "pending"
          }
        status: 200
        contentType: application/json
  # Every postStep is gated on `steps.prep.ok`. A response_handler does NOT terminate a CE
  # pipeline - of the handlers that can, file-serve / stripe-webhook / form always set
  # `terminates` and ai_handler ONLY in `stream` mode (CE ai.handler.ts:665; every ai_handler
  # step in this set uses responseMode: message, so none of them terminate) - so postSteps
  # still fire after the `refuse` branch has answered 400 - ungated, a refused request would
  # run the paid work anyway. finishOk/finishErr need no gate of their own: with `check`
  # skipped, `steps.check.ok` resolves to null (a missing key returns null, it does not
  # throw) and both branches stay off.
  postSteps:
    - id: setRunning
      name: setRunning
      handler: data_update
      config:
        condition: steps.prep.ok
        fields:
          status: "'running'"
        recordId: steps.createJob.id
        schemaId: $schema:workflow_studio_jobs
    - id: sheets
      name: sheets
      handler: ffmpeg_handler
      config:
        condition: steps.prep.ok
        operation: frames
        # THREE syntaxes here, and mixing them up fails at run time:
        #   input/outputPrefix/executor are TEMPLATES  -> wrap in {{ }}
        #   times / draw.text are BARE EXPRESSIONS     -> never {{ }} (a braced value
        #     comes back as a literal string and fails "expected a non-empty array")
        #   tile.perSheet / tile.columns are LITERALS  -> not resolvable at all
        input: "{{steps.prep.input}}"
        outputPrefix: "{{steps.prep.outputPrefix}}"
        times: steps.prep.times
        draw:
          # A STRING with the shape of a whole path is resolved (R106) -> the labels
          # array the caller planned, one clock per still, parallel to `times`.
          text: steps.prep.labels
          # Studio's browser sheet burned the clock bottom-left at ~10% of the cell
          # height, white on a dark strip (apps/studio/src/lib/frames.ts:256-280).
          position: bottom-left
          size: 0.1
        tile:
          perSheet: 12
          columns: 3
        executor: "{{steps.prep.executor}}"
    - id: check
      name: check
      handler: function_handler
      code: ./check.fn.js
      config:
        condition: steps.prep.ok
    - id: finishOk
      name: finishOk
      handler: data_update
      config:
        fields:
          result: steps.check.data
          status: "'done'"
        recordId: steps.createJob.id
        schemaId: $schema:workflow_studio_jobs
        condition: steps.check.ok
    - id: finishErr
      name: finishErr
      handler: data_update
      config:
        fields:
          error: steps.check.error
          code: steps.check.code
          status: "'error'"
        recordId: steps.createJob.id
        schemaId: $schema:workflow_studio_jobs
        condition: steps.check.notOk
  validators:
    - type: auth_required
      config: { allowApiKey: true }
description: "Contact sheets for the master director. The caller plans the sampling (times + the clock label for each cell); this rule validates it (non-empty, finite, non-negative, <= CE's MAX_STILLS_PER_JOB of 200, labels the same length) and hands it to CE. Refuses (400) before a job row exists."
