handler: ./check.fn.js
cases:
  - name: reports the sheets, their cell times, CE's per-sheet cols and drawn telemetry
    data:
      steps:
        sheets:
          sheets:
            - storage_path: o/r/uploads/workflows/run-1/sheets/sheets/sheet-01.jpg
              times: [0, 8, 16]
              cols: 3
              index: 0
            # The short final sheet: CE lays it out `min(chunk, columns)` wide (ce#706).
            - storage_path: o/r/uploads/workflows/run-1/sheets/sheets/sheet-02.jpg
              times: [24]
              cols: 1
              index: 1
          count: 4
          drawn: true
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          paths:
            - workflows/run-1/sheets/sheets/sheet-01.jpg
            - workflows/run-1/sheets/sheets/sheet-02.jpg
          times: [[0, 8, 16], [24]]
          cols: [3, 1]
          drawn: true
  - name: a sheet CE reported no cols for carries null, so the island infers it
    data:
      steps:
        sheets:
          sheets:
            - storage_path: o/r/uploads/workflows/run-1/sheets/sheets/sheet-01.jpg
              times: [0, 8]
              index: 0
          count: 2
          drawn: false
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          paths:
            - workflows/run-1/sheets/sheets/sheet-01.jpg
          times: [[0, 8]]
          cols: [null]
          drawn: false
  - name: no sheets is a failure
    data:
      steps: {}
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: Contact-sheet capture failed
        code: ""
        data: null
  # NOTE: no `stepErrors` case — the CLI fixture schema rejects that data root (see
  # video/extract-audio/post/check.fn.test.yaml).
