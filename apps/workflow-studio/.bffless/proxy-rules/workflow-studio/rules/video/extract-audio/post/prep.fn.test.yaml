handler: ./prep.fn.js
cases:
  - name: accepts a run-prefixed source and normalises the out prefix
    data:
      request:
        body:
          source: workflows/run-1/inputs/a.mp4
          outPrefix: workflows/run-1/audio/
          executor: local
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        input: workflows/run-1/inputs/a.mp4
        outPrefix: workflows/run-1/audio
        executor: local
  - name: refuses a source outside the run prefix
    data:
      request:
        body:
          source: /api/uploads/projects/p1/a.mp4
          outPrefix: workflows/run-1/audio
          executor: auto
    expect:
      result:
        ok: false
        notOk: true
        error: Refused - every path must be an uploads-relative path under workflows/
        input: ""
        outPrefix: ""
        executor: ""
