handler: ./check.fn.js
cases:
  - name: the audio branch returns both paths and the duration, uploads-relative
    data:
      steps:
        sliceWithAudio:
          storage_path: o/r/uploads/workflows/run-1/cut/clip.mp4
          duration: 12.5
          audio:
            storage_path: o/r/uploads/workflows/run-1/cut/clip.wav
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          path: workflows/run-1/cut/clip.mp4
          audioPath: workflows/run-1/cut/clip.wav
          duration: 12.5
  - name: the no-audio branch returns a null audioPath
    data:
      steps:
        sliceOnly:
          storage_path: o/r/uploads/workflows/run-1/assemble/clip.mp4
          duration: 4
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          path: workflows/run-1/assemble/clip.mp4
          audioPath: null
          duration: 4
  - name: a missing step output is a failure
    data:
      steps: {}
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: Server slice failed
        code: ""
        data: null
  # NOTE: cases exercising `stepErrors` (the ce#662 forward-compat read in check.fn.js, which
  # is what fills `code`) are omitted because the bffless CLI's fixture schema
  # (node_modules/bffless/dist/format/manifest.js `FnTestCaseDataSchema`, .strict()) accepts
  # only user/request/steps/deployment as data roots — the same gap apps/studio documents.
