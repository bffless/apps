handler: ./prep.fn.js
cases:
  - name: the cut call (wantAudio) keeps the audio branch and normalises the out prefix
    data:
      request:
        body:
          source: workflows/run-1/inputs/a.mp4
          spans:
            - { start: 1, end: 5 }
            - { start: 9.5, end: 12 }
          wantAudio: true
          outPrefix: workflows/run-1/cut/
          executor: local
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        input: workflows/run-1/inputs/a.mp4
        outPrefix: workflows/run-1/cut
        spans:
          - { start: 1, end: 5 }
          - { start: 9.5, end: 12 }
        wantAudio: true
        noAudio: false
        audioFades: false
        executor: local
  - name: the assemble call (no audio, audioFades) takes the no-audio branch and drops executor 'auto'
    data:
      request:
        body:
          source: workflows/run-1/cut/clip.mp4
          spans:
            - { start: 0, end: 4 }
          wantAudio: false
          audioFades: true
          outPrefix: workflows/run-1/assemble
          executor: auto
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        input: workflows/run-1/cut/clip.mp4
        outPrefix: workflows/run-1/assemble
        spans:
          - { start: 0, end: 4 }
        wantAudio: false
        noAudio: true
        audioFades: true
        executor: ""
  - name: refuses a source outside the run prefix - and neither slice branch arms
    data:
      request:
        body:
          source: /api/uploads/projects/p1/a.mp4
          spans:
            - { start: 1, end: 5 }
          wantAudio: true
          outPrefix: workflows/run-1/cut
    expect:
      result:
        ok: false
        notOk: true
        error: Refused - every path must be an uploads-relative path under workflows/
        input: ""
        outPrefix: ""
        spans: []
        wantAudio: false
        noAudio: false
        audioFades: false
        executor: ""
  - name: refuses empty spans
    data:
      request:
        body:
          source: workflows/run-1/inputs/a.mp4
          spans: []
          wantAudio: true
          outPrefix: workflows/run-1/cut
    expect:
      result:
        ok: false
        notOk: true
        error: Refused - spans must be a non-empty list of { start, end } seconds with end > start
        input: ""
        outPrefix: ""
        spans: []
        wantAudio: false
        noAudio: false
        audioFades: false
        executor: ""
  - name: refuses a span whose end is not after its start
    data:
      request:
        body:
          source: workflows/run-1/inputs/a.mp4
          spans:
            - { start: 4, end: 4 }
          wantAudio: false
          outPrefix: workflows/run-1/cut
    expect:
      result:
        ok: false
        notOk: true
        error: Refused - spans must be a non-empty list of { start, end } seconds with end > start
        input: ""
        outPrefix: ""
        spans: []
        wantAudio: false
        noAudio: false
        audioFades: false
        executor: ""
