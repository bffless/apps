targetUrl: pipeline
timeout: 120000
pipeline:
  name: Server video slice (ffmpeg, async)
  description: "POST { source, spans, wantAudio, audioFades, outPrefix, executor } -> ENQUEUE a job (kind 'video-slice') and return { jobId, status: 'pending' }; CE's ffmpeg slice op keeps the given spans and (when wantAudio) emits a second 16 kHz mono WAV pass, reading and writing storage directly. Result { path, audioPath, duration } (uploads-relative; audioPath null without the audio pass) is polled via GET job?id=. Ported from apps/studio /api/video/slice: paths are run-prefixed and relative, the outputs are `<outPrefix>/clip.mp4` (+ `/clip.wav`) rather than uuid names under a project, and the result carries paths rather than /api/uploads/ URLs. The workflow calls this TWICE per scene - `cut` (wantAudio: true) and `assemble` (wantAudio: false, audioFades: true)."
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: refuse
      name: refuse
      handler: response_handler
      config:
        condition: steps.prep.notOk
        # apps#525: prep serializes the whole envelope (`failJson`, JSON.stringify) and
        # the triple-stache renders it verbatim - a {{...}} template cannot escape a `"`
        # or a `\` in the message, so a hand-built JSON literal here was one quoted
        # upstream message away from an invalid body.
        body: "{{{steps.prep.failJson}}}"
        status: 400
        contentType: application/json
    - id: createJob
      name: createJob
      handler: data_create
      config:
        condition: steps.prep.ok
        fields:
          kind: "'video-slice'"
          status: "'pending'"
          request: request.body
        schemaId: $schema:workflow_studio_jobs
    - id: respond
      name: respond
      handler: response_handler
      config:
        condition: steps.prep.ok
        body: |-
          {
            "jobId": "{{steps.createJob.id}}",
            "status": "pending"
          }
        status: 200
        contentType: application/json
  # Every postStep is gated on `steps.prep.ok`. A response_handler does NOT terminate a CE
  # pipeline - of the handlers that can, file-serve / stripe-webhook / form always set
  # `terminates` and ai_handler ONLY in `stream` mode (CE ai.handler.ts:665; every ai_handler
  # step in this set uses or defaults to responseMode: message, so none terminate) - so postSteps
  # still fire after the `refuse` branch has answered 400 - ungated, a refused request would
  # run the paid work anyway. The two slice branches carry that gate in their own condition:
  # prep returns wantAudio AND noAudio false on a refusal (see prep.fn.js). finishOk/finishErr
  # need no gate of their own: with `check` skipped, `steps.check.ok` resolves to null (a
  # missing key returns null, it does not throw) and both branches stay off.
  # The ONE ungated postStep is `sweep`, the last one. A step that THROWS writes nothing to
  # `steps` and CE's runPostSteps logs it and carries on to the next step, so with `check`
  # thrown `steps.check.ok` and `.notOk` both resolve to null, neither finish branch fires
  # and the row would sit `running` until the workflow's poll timeout. `sweep` folds
  # `steps.prep.ok` in itself (a condition is a simple path, and a refused request has no
  # job row to write onto) and `finishStuck` writes the row to error with code STEP_THREW,
  # which the workflow's `poll.fail` ends on at once (apps#467).
  postSteps:
    - id: setRunning
      name: setRunning
      handler: data_update
      config:
        condition: steps.prep.ok
        fields:
          status: "'running'"
        recordId: steps.createJob.id
        schemaId: $schema:workflow_studio_jobs
    - id: sliceWithAudio
      name: sliceWithAudio
      handler: ffmpeg_handler
      config:
        condition: steps.prep.wantAudio
        operation: slice
        # Which CE executor runs this job ('local' | 'remote'; template-evaluated).
        # Empty string => CE's configured default, which is how the workflow's `auto` works.
        executor: "{{steps.prep.executor}}"
        # input/output are TEMPLATES (evaluateTemplate: only {{...}} is substituted, a bare
        # expression string passes through literally) - always wrap them in {{}}. `spans` is
        # expression-evaluated instead and must stay unbraced.
        input: "{{steps.prep.input}}"
        spans: steps.prep.spans
        # ffmpeg_handler reads audioFades as a RAW boolean (config.audioFades === true), never
        # expression-evaluated - an expression string would always be truthy-non-true - so it is
        # hardcoded per branch exactly as Studio's rule does: false on the cut pass (this one,
        # which also emits the scene WAV the refiner listens to), true on the assemble pass.
        audioFades: false
        output: "{{steps.prep.outPrefix}}/clip.mp4"
        audioOutput: "{{steps.prep.outPrefix}}/clip.wav"
    - id: sliceOnly
      name: sliceOnly
      handler: ffmpeg_handler
      config:
        condition: steps.prep.noAudio
        operation: slice
        executor: "{{steps.prep.executor}}"
        input: "{{steps.prep.input}}"
        spans: steps.prep.spans
        audioFades: true
        output: "{{steps.prep.outPrefix}}/clip.mp4"
    - id: check
      name: check
      handler: function_handler
      code: ./check.fn.js
      config:
        condition: steps.prep.ok
    - id: finishOk
      name: finishOk
      handler: data_update
      config:
        fields:
          result: steps.check.data
          status: "'done'"
        recordId: steps.createJob.id
        schemaId: $schema:workflow_studio_jobs
        condition: steps.check.ok
    - id: finishErr
      name: finishErr
      handler: data_update
      config:
        fields:
          error: steps.check.error
          code: steps.check.code
          status: "'error'"
        recordId: steps.createJob.id
        schemaId: $schema:workflow_studio_jobs
        condition: steps.check.notOk
    - id: sweep
      name: sweep
      handler: function_handler
      code: ./sweep.fn.js
    - id: finishStuck
      name: finishStuck
      handler: data_update
      config:
        fields:
          error: steps.sweep.message
          code: "'STEP_THREW'"
          status: "'error'"
        recordId: steps.createJob.id
        schemaId: $schema:workflow_studio_jobs
        condition: steps.sweep.stuck
  validators:
    - type: auth_required
      config: { allowApiKey: true }
description: "Server-side video slicing (keep the given spans) via CE's ffmpeg_handler, with an optional second-pass 16 kHz mono WAV so the refiner can hear the scene. Refuses (400) any path outside the harness's workflows/ run prefix, and any empty or malformed span list, before a job row is created."
