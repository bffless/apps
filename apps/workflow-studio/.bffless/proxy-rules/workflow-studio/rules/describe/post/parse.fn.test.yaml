handler: ./parse.fn.js
cases:
  - name: reads the Claude ai_handler completion from .content
    data:
      steps:
        describe:
          content: '{"title": "Add cookie auth to a static site with BFFless", "summary": "In this video I add login to a static site with BFFless proxy rules."}'
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        descriptionJson: '{"title":"Add cookie auth to a static site with BFFless","summary":"In this video I add login to a static site with BFFless proxy rules."}'
  - name: tolerates fences and commentary around the JSON
    data:
      steps:
        describe:
          content: "Here you go:\n```json\n{\"title\": \"  A title \", \"summary\": \"Two sentences. Really.\"}\n```"
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        descriptionJson: '{"title":"A title","summary":"Two sentences. Really."}'
  - name: still reads the legacy replicate output shape
    data:
      steps:
        describe:
          output: ['{"title": "T', '", "summary": "S"}']
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        descriptionJson: '{"title":"T","summary":"S"}'
  - name: an unreadable answer is an error envelope (R120), never an empty title
    data:
      steps:
        describe:
          content: "Sorry, I cannot help with that."
    expect:
      result:
        ok: false
        notOk: true
        error: The AI description writer did not return a usable title and summary - it may be temporarily overloaded. Please try again.
        # R137: the static fallback the fn supplies when `stepErrors` gives nothing;
        # the rule's fail branch emits THIS value, not a hard-coded one.
        code: AI_UNREADABLE
        descriptionJson: ""
  - name: a missing step is an error envelope too
    data:
      steps: {}
    expect:
      result:
        ok: false
        notOk: true
        error: The AI description writer did not return a usable title and summary - it may be temporarily overloaded. Please try again.
        # R137: the static fallback the fn supplies when `stepErrors` gives nothing;
        # the rule's fail branch emits THIS value, not a hard-coded one.
        code: AI_UNREADABLE
        descriptionJson: ""
