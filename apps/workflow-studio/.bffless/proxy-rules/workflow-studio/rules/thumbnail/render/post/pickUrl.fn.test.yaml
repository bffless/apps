handler: ./pickUrl.fn.js
cases:
  - name: a bare string output is the url
    data:
      steps:
        generate:
          output: https://replicate.delivery/x/out-0.png
    expect:
      result: { url: https://replicate.delivery/x/out-0.png }
  - name: an array output takes the first image
    data:
      steps:
        generate:
          output:
            - https://replicate.delivery/x/out-0.png
            - https://replicate.delivery/x/out-1.png
    expect:
      result: { url: https://replicate.delivery/x/out-0.png }
  - name: an object output with `image`
    data:
      steps:
        generate:
          output: { image: https://replicate.delivery/x/out-0.png }
    expect:
      result: { url: https://replicate.delivery/x/out-0.png }
  - name: an object output with `url`
    data:
      steps:
        generate:
          output: { url: https://replicate.delivery/x/out-0.png }
    expect:
      result: { url: https://replicate.delivery/x/out-0.png }
  - name: a missing step degrades to an empty url, never throws
    data:
      steps: {}
    expect:
      result: { url: "" }
