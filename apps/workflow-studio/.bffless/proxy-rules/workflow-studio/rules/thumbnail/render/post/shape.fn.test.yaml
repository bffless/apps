handler: ./shape.fn.js
cases:
  - name: strips the uploads root off the stored image and answers { path }
    data:
      steps:
        store:
          storage_path: o/r/uploads/workflows/run-1/covers-1/8f0c-cover.png
          content_type: image/png
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        pathJson: '{"path":"workflows/run-1/covers-1/8f0c-cover.png"}'
  - name: a missing store output is an error envelope (R120)
    data:
      steps: {}
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: The thumbnail could not be rendered or stored. Please try again.
        # R137: the static fallback the fn supplies when `stepErrors` gives nothing;
        # the rule's fail branch emits THIS value, not a hard-coded one.
        code: RENDER_FAILED
        pathJson: ""
  # NOTE: `stepErrors` cases are omitted - the CLI's fixture schema accepts only
  # user/request/steps/deployment as data roots (see video/slice/post/check.fn.test.yaml).
