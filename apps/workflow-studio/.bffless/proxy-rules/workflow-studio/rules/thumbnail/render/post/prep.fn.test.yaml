handler: ./prep.fn.js
cases:
  - name: accepts a prompt and normalises the run-prefixed out prefix; no reference means no image_input
    data:
      request:
        body:
          prompt: "16:9 YouTube thumbnail, vintage technical manual."
          outPrefix: workflows/run-1/cover-1/
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        failJson: ""
        prompt: "16:9 YouTube thumbnail, vintage technical manual."
        outPrefix: workflows/run-1/cover-1
        images: []
  - name: a null reference (what `reference.path` of an unfilled upload evaluates to) is none
    data:
      request:
        body:
          prompt: "16:9 YouTube thumbnail."
          reference: null
          outPrefix: workflows/run-1/cover-1
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        failJson: ""
        prompt: "16:9 YouTube thumbnail."
        outPrefix: workflows/run-1/cover-1
        images: []
  - name: a confined reference becomes a one-element image_input of its full storage path
    data:
      request:
        body:
          prompt: "16:9 YouTube thumbnail, use the attached reference photo of the presenter."
          reference: /workflows/run-1/inputs/me.jpg
          outPrefix: workflows/run-1/cover-1
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        failJson: ""
        prompt: "16:9 YouTube thumbnail, use the attached reference photo of the presenter."
        outPrefix: workflows/run-1/cover-1
        images:
          - o/r/uploads/workflows/run-1/inputs/me.jpg
  - name: refuses a reference outside the run prefix rather than dropping it
    data:
      request:
        body:
          prompt: "16:9 YouTube thumbnail."
          reference: projects/p1/youtube-thumbnail/ref.jpg
          outPrefix: workflows/run-1/cover-1
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: Refused - every path must be an uploads-relative path under workflows/
        failJson: '{"error":"Refused - every path must be an uploads-relative path under workflows/","code":"BAD_REQUEST"}'
        prompt: ""
        outPrefix: ""
        images: []
  - name: refuses a traversing reference
    data:
      request:
        body:
          prompt: "16:9 YouTube thumbnail."
          reference: workflows/run-1/../../secret.jpg
          outPrefix: workflows/run-1/cover-1
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: Refused - every path must be an uploads-relative path under workflows/
        failJson: '{"error":"Refused - every path must be an uploads-relative path under workflows/","code":"BAD_REQUEST"}'
        prompt: ""
        outPrefix: ""
        images: []
  - name: refuses an out prefix outside the run prefix
    data:
      request:
        body:
          prompt: "16:9 YouTube thumbnail."
          outPrefix: projects/p1/youtube-thumbnail
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: Refused - every path must be an uploads-relative path under workflows/
        failJson: '{"error":"Refused - every path must be an uploads-relative path under workflows/","code":"BAD_REQUEST"}'
        prompt: ""
        outPrefix: ""
        images: []
  - name: refuses an empty prompt
    data:
      request:
        body:
          prompt: "   "
          outPrefix: workflows/run-1/cover-1
      deployment: { owner: o, repo: r }
    expect:
      result:
        ok: false
        notOk: true
        error: Refused - prompt must be a non-empty string
        failJson: '{"error":"Refused - prompt must be a non-empty string","code":"BAD_REQUEST"}'
        prompt: ""
        outPrefix: ""
        images: []
