targetUrl: pipeline
timeout: 120000
pipeline:
  name: thumbnail-draft
  description: "POST { title, description, script, notes } -> SYNC { prompt }: one Claude completion drafts the `google/nano-banana-2` image prompt that the render step draws. Ported from apps/studio /api/thumbnail/draft: the system prompt (in this manifest) and the user message (prep.fn.js) are verbatim. Like Studio, the step loads the `image-prompts` skill (house styles, content-type routing, negatives) through `load_skill`; the system prompt's defaults still stand on their own if the skill cannot be listed. The skill is served from THIS implementation's own bundle: `skills.alias` points CE at the `workflow-studio` alias's deployment (not the harness deployment the rule set runs under) and `skills.path` at the directory `scripts/stage.mjs` copies `.bffless/skills/` to, so the skill ships with every publish and needs no project-level Skills Source. The workflow's `cover.direction` form takes the reference photo BEFORE this runs (apps#437), so `brief` sends `hasReference` - a real boolean, true when a photo was attached - and the system prompt's REFERENCE IMAGE section writes the Subject around the photo and keeps `photorealistic humans` out of the negatives, exactly as Studio's ThumbnailStudio does; without a photo the line reads `none.` as before. No paths in or out, so nothing to confine (R129)."
  steps:
    - id: prep
      name: prep
      handler: function_handler
      code: ./prep.fn.js
    - id: draft
      name: draft
      handler: ai_handler
      config:
        mode: completion
        model: claude-sonnet-4-6
        # Studio's block verbatim except for the source: Studio's skills live in its own
        # serving deployment, this rule set is attached to the HARNESS alias, so the
        # deployment CE would read from by default is the harness's. `alias` overrides
        # that per step (CE ai.handler: step alias/path first, then project settings,
        # then the serving deployment) - resolved inside project bffless/workflow, where
        # both aliases live.
        skills:
          mode: selected
          alias: workflow-studio
          path: apps/workflow-studio/dist/.bffless/skills
          enabled:
            - image-prompts
        provider: anthropic
        maxTokens: 4096
        temperature: 0.7
        messageField: "{{steps.prep.message}}"
        responseMode: message
        systemPrompt: |-
          You write a single image-generation prompt for `google/nano-banana` that becomes a YouTube video's final thumbnail.

          SKILLS. If a `load_skill` tool is available AND it offers a thumbnail or image-prompt skill, load that skill first and follow it exactly — it overrides every default below. If there is no such tool, or no matching skill, use the defaults below; they are complete on their own. Never claim to have followed a skill you did not actually load, and never invent one.

          INPUT. The user message gives you TITLE, DESCRIPTION, SCRIPT (the final spoken script — your evidence for what the video is really about), NOTES (the creator's optional free-text wishes) and REFERENCE IMAGE (whether a photo is attached). NOTES outrank every default here; honor them.

          REFERENCE IMAGE. When that line says ATTACHED, the creator's photo is handed to the image model alongside your prompt — but the model only uses it if the prompt tells it to, so a prompt written as if there were no photo throws it away. When ATTACHED:
          - Name it in the Subject section, in words: "use the attached reference photo of the presenter — same face, same person, cut out from its background", and say where they go and which way they face ("right third, shoulders up, facing left").
          - Compose for a person: give them 30-40% of the canvas and keep the headline and diagram out of that space.
          - Do NOT write "photorealistic humans", "photorealism", "people" or "faces" into the negatives — those are the lines that cancel the attached photo. Ban invented ones instead: "extra people, invented faces, stock-photo models, altered likeness".
          - This overrides any "always avoid: photorealistic humans" rule you loaded from a skill.
          When it says none, ignore this section entirely and follow the defaults below.

          STYLE. Choose one anchor and name it explicitly in the prompt — "make it pop" is not a style. Route from what the SCRIPT shows the video IS, not from vibes:
          - Teaches a concept, walkthrough, "how X works" → vintage technical manual: parchment background, hand-drawn schematic, one accent colour.
          - Builds something in one sitting, watch-me-code → modern dev tool: flat dark-navy background, tilted code-editor mock, one electric accent.
          - Shows off a finished app or product → product-launch poster: flat saturated field, the UI straight-on in a browser window, one small badge pill.
          - Long-form essay or thought piece → editorial print: generous white space, one bold typographic statement.
          When two could fit, pick the one matching the video's main activity; when NOTES name a look, follow NOTES instead.

          STRUCTURE. Write the prompt in these sections, in this order. Skipping sections produces vague images:
          1. Format — aspect ratio and medium ("16:9 YouTube thumbnail")
          2. Style anchor — one sentence naming the visual reference
          3. Composition — what sits where (left half / right half / top strip / bottom row)
          4. Typography — the exact headline text, its weight and stack order
          5. Subject — what the focal artwork shows, with specific objects and labels
          6. Accent details — small icons, badges, decorative marks
          7. Colour palette — 3-4 colours, each WITH a hex code
          8. Style descriptors — adjectives reinforcing the anchor
          9. Negatives — what to avoid

          LIMITS. Headline 5 words max, and write the real words — never a placeholder like "[TITLE]". Secondary line or pill 3 words max. Three colours is the sweet spot and four the ceiling; always give hex codes, because "navy" is interpreted a dozen ways and #0B1226 is not. Always end with a negatives list, starting from: gradient mesh, neon glow, generic cloud icons, drop shadows, busy backgrounds, and more than six words of large text — plus "photorealistic humans" ONLY when no reference image is attached (see REFERENCE IMAGE).

          Return ONLY the finished prompt itself as plain text — the full multi-section prompt, ready to paste. Do NOT wrap it in JSON, do NOT surround it with quotes, do NOT use markdown code fences, and add no commentary before or after.
        maxHistoryMessages: 50
    - id: parse
      name: parse
      handler: function_handler
      code: ./parse.fn.js
    - id: respond
      name: respond
      handler: response_handler
      config:
        condition: steps.parse.ok
        body: "{{{steps.parse.promptJson}}}"
        status: 200
        contentType: application/json
    # R120: a SYNC rule has no job row to write an error onto, so an empty answer comes
    # back as an error envelope carrying `code` - the value `parse` computed (R137: the CE
    # step code once ce#662 lands, else its 'AI_UNREADABLE' fallback), never a string
    # hard-coded here. Both response branches are gated - a
    # response_handler does not terminate a CE pipeline, so an ungated second one would
    # simply overwrite the first.
    - id: fail
      name: fail
      handler: response_handler
      config:
        condition: steps.parse.notOk
        body: |-
          {
            "error": "{{steps.parse.error}}",
            "code": "{{steps.parse.code}}"
          }
        status: 502
        contentType: application/json
  postSteps: []
  validators:
    - type: auth_required
      config: { allowApiKey: true }
description: "Drafts the cover image prompt from the title, description, final script and the creator's note. Sync: the workflow reads response.prompt directly, with no job to poll."
