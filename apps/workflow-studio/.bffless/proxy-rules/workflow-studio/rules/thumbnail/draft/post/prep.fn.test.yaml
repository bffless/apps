# The `system` / `prompt` expectations below are apps/studio's OWN prep output: they were
# generated by running Studio's prep.fn.js and writing back what it returned, so this fixture
# asserts STUDIO's text rather than this port's. Any drift in a prompt string fails here.
#
# `hasReference` is what the workflow's `brief` step sends (apps#437): `steps.direction.
# outputs.reference != null`, a real boolean because a value that is exactly one expression
# keeps its type (spec 01). Both readings are pinned - and so is the rule that only a real
# `true` counts, since a stringified flag would silently draft the photo away again.
handler: ./prep.fn.js
cases:
  - name: builds Studio's thumbnail brief verbatim; no photo on the cover-direction form reads as none
    data:
      request:
        body:
          title: Add cookie auth to a static site
          description: In this video I add login to a static site with BFFless proxy rules.
          script: So today I'm adding login to a static site.
          notes: make it look like a dev tool
          hasReference: false
    expect:
      result:
        message: |-
          TITLE:
          Add cookie auth to a static site

          DESCRIPTION:
          In this video I add login to a static site with BFFless proxy rules.

          SCRIPT (final spoken narration, in order):
          So today I'm adding login to a static site.

          NOTES (creator wishes, optional):
          make it look like a dev tool

          REFERENCE IMAGE:
          none.
  - name: a photo on the cover-direction form flips the REFERENCE IMAGE line to ATTACHED
    data:
      request:
        body:
          title: Add cookie auth to a static site
          description: In this video I add login to a static site with BFFless proxy rules.
          script: So today I'm adding login to a static site.
          notes: me on the right, dev-tool look
          hasReference: true
    expect:
      result:
        message: |-
          TITLE:
          Add cookie auth to a static site

          DESCRIPTION:
          In this video I add login to a static site with BFFless proxy rules.

          SCRIPT (final spoken narration, in order):
          So today I'm adding login to a static site.

          NOTES (creator wishes, optional):
          me on the right, dev-tool look

          REFERENCE IMAGE:
          ATTACHED - the creator uploaded a photo (usually of themselves, sometimes a product) and it is passed to the image model together with your prompt. Write the prompt so the model BUILDS THE THUMBNAIL AROUND IT.
  - name: only a real boolean true counts - a stringified flag still reads as none
    data:
      request:
        body:
          title: T
          hasReference: "true"
    expect:
      result:
        message: |-
          TITLE:
          T

          DESCRIPTION:


          SCRIPT (final spoken narration, in order):


          NOTES (creator wishes, optional):


          REFERENCE IMAGE:
          none.
  - name: an empty body still renders every section
    data:
      request:
        body: {}
    expect:
      result:
        message: |-
          TITLE:


          DESCRIPTION:


          SCRIPT (final spoken narration, in order):


          NOTES (creator wishes, optional):


          REFERENCE IMAGE:
          none.
