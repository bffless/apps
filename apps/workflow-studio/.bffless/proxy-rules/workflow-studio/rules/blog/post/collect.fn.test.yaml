handler: ./collect.fn.js
cases:
  - name: collects the signed sheet URLs in order
    data:
      steps:
        sign0: { url: "https://bucket/s0.jpg?sig=a" }
        sign1: { url: "https://bucket/s1.jpg?sig=b" }
    expect:
      result:
        images: ["https://bucket/s0.jpg?sig=a", "https://bucket/s1.jpg?sig=b"]
        count: 2
  - name: no signed sheets yields no images
    data:
      steps: {}
    expect:
      result:
        images: []
        count: 0
