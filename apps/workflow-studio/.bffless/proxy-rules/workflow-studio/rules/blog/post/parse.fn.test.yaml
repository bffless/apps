handler: ./parse.fn.js
cases:
  - name: reads the Claude writer's markdown from .content
    data:
      steps:
        blogClaude:
          content: '{"markdown":"---\ntitle: A post\n---\n\nHello.\n"}'
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          markdown: |-
            ---
            title: A post
            ---

            Hello.
  - name: reads the Gemini writer's output when the Claude step is off
    data:
      steps:
        blog:
          output: ['{"markdown":"# Title', '\n\nBody."}']
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          markdown: |-
            # Title

            Body.
  - name: salvages the markdown from a truncated document
    data:
      steps:
        blogClaude:
          content: '{"markdown":"# Title\n\nA half-written'
    expect:
      result:
        ok: true
        notOk: false
        error: ""
        code: ""
        data:
          markdown: |-
            # Title

            A half-written
  - name: no writer answered - a failure
    data:
      steps: {}
    expect:
      result:
        ok: false
        notOk: true
        error: The AI writer did not return a result — it may be temporarily overloaded, or the video may be too long. Please try again.
        code: ""
        data: { markdown: "" }
  # NOTE: no `stepErrors` case - the CLI fixture schema rejects that data root (see
  # video/extract-audio/post/check.fn.test.yaml).
