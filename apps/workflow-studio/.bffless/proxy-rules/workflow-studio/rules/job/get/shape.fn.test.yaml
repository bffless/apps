handler: ./shape.fn.js
cases:
  - name: a done row exposes status + parsed result
    data:
      steps:
        query:
          status: done
          kind: video-extract
          result: '{"path":"workflows/run-1/audio/audio.wav"}'
          error: null
          code: null
    expect:
      result:
        status: done
        result: { path: workflows/run-1/audio/audio.wav }
        error: null
        code: null
  - name: an errored row carries error and code
    data:
      steps:
        query:
          status: error
          result: null
          error: Server audio extraction failed
          code: FFMPEG_BUSY
    expect:
      result:
        status: error
        result: null
        error: Server audio extraction failed
        code: FFMPEG_BUSY
  - name: an unknown id reads as still pending
    data:
      steps: {}
    expect:
      result:
        status: pending
        result: null
        error: null
        code: null
