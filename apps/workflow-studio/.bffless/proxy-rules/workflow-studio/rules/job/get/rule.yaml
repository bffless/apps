targetUrl: pipeline
timeout: 120000
pipeline:
  name: Workflow Studio job poll
  description: "GET ?id=<jobId> -> { status, result, error, code }. What every `poll:` step in studio.workflow.yaml reads on each tick until `response.status == 'done'` (or fails on 'error'). Ported from apps/studio's /api/studio/job with the schema renamed and `code` added (R120)."
  steps:
    - id: query
      name: query
      handler: data_query
      config:
        recordId: request.query.id
        schemaId: $schema:workflow_studio_jobs
    - id: shape
      name: shape
      handler: function_handler
      code: ./shape.fn.js
    - id: respond
      name: respond
      handler: response_handler
      config:
        body: "{{{steps.shape}}}"
        status: 200
        headers:
          Cache-Control: no-store
        contentType: application/json
  validators:
    - type: auth_required
      config: { allowApiKey: true }
description: "Workflow Studio job poll: read a workflow_studio_jobs row by id. Cache-Control: no-store so a poll never reads a stale pending."
