name: workflow_studio_uploads
# `kind: upload` is what file_upload_handler needs: the seven columns CE fills for a stored
# object. Studio's equivalent is `youtube_thumbnail` (apps/studio/.bffless/proxy-rules/studio/
# schemas/youtube_thumbnail.schema.yaml) - same fields, renamed for this set, and with no
# `id:` so the CLI creates it fresh in whichever project the set is pushed to.
kind: upload
fields:
  - name: filename
    type: string
    required: true
  - name: storage_path
    type: string
    required: true
  - name: content_type
    type: string
    required: true
  - name: size
    type: number
    required: true
  - name: url
    type: string
    required: true
  - name: sub_dir
    type: string
    required: true
  - name: original_name
    type: string
    required: true
