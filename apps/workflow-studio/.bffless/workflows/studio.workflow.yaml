spec: 1
name: Long recording to published short
description: >
  Turn one or more long screen recordings into a short in your own recorded voice — cut-first,
  never re-voiced — plus a companion blog post and a cover image. The reference port of Studio.

on:
  manual:
    inputs:
      recordings: { type: file, accept: "video/*", list: true, required: true, maxSize: 5GB, label: Recordings }
      direction:  { type: string, format: textarea, label: Note to the director }
      write_blog: { type: boolean, default: true, label: Write a blog post }
      cover:      { type: boolean, default: true, label: Draw a cover }
      # The cover's own brief - what it should show and in what style - distinct from the
      # director's `direction`, which is about the cut. `cover.brief` hands it to
      # thumbnail/draft as `notes`, the field Studio's ThumbnailStudio fills from its
      # free-text notes box; NOTES outrank every default in that rule's system prompt.
      cover_direction: { type: string, format: textarea, label: Cover direction, description: "What the cover should show, and in what style (optional). Only read when a cover is drawn." }

jobs:
  per-video:
    name: For each video
    strategy: { matrix: { video: "${{ inputs.recordings }}" }, max-parallel: 2 }
    steps:
      - id: audio
        name: Pull the audio out
        uses: pipeline
        with:
          path: video/extract-audio
          # No executor input here — the kickoff form is static, so it can't reflect what an
          # instance actually has enabled. Every video step below omits `executor` from its
          # body; the rules' `prep` still passes it through, so an absent field resolves to
          # '', CE omits it, and the instance's configured default executor runs (Admin →
          # Features → Executor). API callers hitting the rules directly can still pass an
          # explicit `executor` to override it.
          body: { source: "${{ matrix.video.path }}", outPrefix: "${{ step.prefix }}" }
        poll: { path: job, query: { id: "${{ response.jobId }}" }, until: "${{ response.status == 'done' }}", fail: "${{ response.status == 'error' }}", every: 3s, timeout: 20m }
        retry: { max: 3, delay: 10s, if: "${{ error.code == 'FFMPEG_BUSY' }}" }
        outputs:
          wav: { type: file, value: "${{ response.result.path }}" }
      - id: transcribe
        name: Write the transcript
        uses: pipeline
        with: { path: transcribe, body: { audio: "${{ steps.audio.outputs.wav.path }}", diarize: false } }
        poll: { path: job, query: { id: "${{ response.jobId }}" }, until: "${{ response.status == 'done' }}", fail: "${{ response.status == 'error' }}", every: 5s, timeout: 30m }
        outputs:
          words: { type: json, value: "${{ response.result.words }}", render: transcript }
          text:  { type: string, value: "${{ response.result.text }}" }
          timed: { type: string, value: "${{ response.result.timed }}" }
          duration: { type: number, value: "${{ response.result.duration }}" }
        summary: "Transcribed **${{ matrix.video.name }}** — ${{ length(steps.transcribe.outputs.words) }} words."
        annotations:
          - { level: warning, if: "${{ length(steps.transcribe.outputs.words) < 50 }}", message: "Very short transcript for ${{ matrix.video.name }} — is the audio silent?" }
    outputs:
      source: { type: file, value: "${{ matrix.video }}" }
      # The SOURCE's extracted audio, not a scene clip's. The cut editor's transport
      # seeks it in original-source seconds (Studio's `CutEditor` has no audio offset —
      # `windowStart` only bounds the grid), so a scene starting at 1:40 seeks to 1:40:
      # on a clip's own WAV that is past the end and plays silence.
      wav:    ${{ steps.audio.outputs.wav }}
      words:  ${{ steps.transcribe.outputs.words }}
      timed:  ${{ steps.transcribe.outputs.timed }}
      duration: ${{ steps.transcribe.outputs.duration }}

  # R147: the contact sheets are planned ONCE, across every recording laid end to end on
  # one global timeline - Studio's own `planGlobalSheetCaptures`. Planning per recording
  # (which is what `per-video` used to do) got both halves wrong: it burned each frame's
  # LOCAL clock while the director and the blog read a GLOBAL one, and it spent the whole
  # 10-sheet budget on each recording, so `scenes`/`blog` - which sign the first 10 sheets
  # - never saw the second recording at all. One plan, one budget, one clock.
  plan:
    name: Plan the contact sheets
    needs: per-video
    steps:
      - id: plan
        name: Plan the contact sheets
        uses: script
        with:
          src: scripts/sheet-plan.js
          sources: ${{ needs.per-video.outputs.source }}
          durations: ${{ needs.per-video.outputs.duration }}
        outputs:
          plans: { type: json }
    outputs:
      plans: ${{ steps.plan.outputs.plans }}

  # One matrix leg per SOURCE - `plans` carries exactly one entry per `per-video` item, in
  # the same order, so `needs.sheets.outputs.sheets[matrix.scene.sourceIndex]` still lines
  # up with the director's `sourceIndex`. A recording with no spoken audio plans no times;
  # its leg is `if:`-skipped (`video/contact-sheet` refuses an empty plan) and its collected
  # `sheets`/`times` entry is null, which every consumer tolerates.
  sheets:
    name: Grab still frames
    needs: plan
    strategy: { matrix: { plan: "${{ needs.plan.outputs.plans }}" }, max-parallel: 2 }
    steps:
      - id: sheets
        name: Grab still frames
        uses: pipeline
        if: "${{ length(matrix.plan.times) > 0 }}"
        with:
          path: video/contact-sheet
          body: { source: "${{ matrix.plan.source }}", outPrefix: "${{ step.prefix }}", times: "${{ matrix.plan.times }}", labels: "${{ matrix.plan.labels }}" }
        poll: { path: job, query: { id: "${{ response.jobId }}" }, until: "${{ response.status == 'done' }}", fail: "${{ response.status == 'error' }}", every: 3s, timeout: 20m }
        retry: { max: 3, delay: 10s, if: "${{ error.code == 'FFMPEG_BUSY' }}" }
        outputs:
          sheets: { type: file, list: true, value: "${{ response.result.paths }}", render: images }
          times:  { type: json, value: "${{ response.result.times }}" }
    outputs:
      sheets: ${{ steps.sheets.outputs.sheets }}
      times: ${{ steps.sheets.outputs.times }}

  director:
    name: Director's take
    needs: [per-video, sheets]
    steps:
      - id: scenes
        uses: pipeline
        with:
          path: scenes
          body:
            timed:     ${{ needs.per-video.outputs.timed }}
            sheets:    ${{ pluck(needs.sheets.outputs.sheets, 'path') }}
            durations: ${{ needs.per-video.outputs.duration }}
            sources:   ${{ pluck(needs.per-video.outputs.source, 'path') }}
            direction: ${{ inputs.direction }}
        poll: { path: job, query: { id: "${{ response.jobId }}" }, until: "${{ response.status == 'done' }}", fail: "${{ response.status == 'error' }}", every: 5s, timeout: 15m }
        outputs:
          synopsis: { type: markdown, value: "${{ response.result.synopsis }}" }
          scenes:   { type: table, value: "${{ response.result.scenes }}", columns: [{key: title}, {key: source}, {key: start, type: number}, {key: end, type: number}] }
        summary: |
          ### Director's take
          ${{ steps.scenes.outputs.synopsis }}

          ${{ length(steps.scenes.outputs.scenes.rows) }} scenes proposed.
    outputs:
      synopsis: ${{ steps.scenes.outputs.synopsis }}
      scenes:   { type: json, list: true, value: "${{ steps.scenes.outputs.scenes.rows }}" }

  per-scene:
    name: For each scene
    needs: [director, per-video, sheets]
    strategy: { matrix: { scene: "${{ needs.director.outputs.scenes }}" }, max-parallel: 3, fail-fast: false }
    steps:
      - id: cut
        name: Cut the scene
        uses: pipeline
        with:
          path: video/slice
          body: { source: "${{ matrix.scene.source }}", spans: "${{ matrix.scene.spans }}", wantAudio: true, outPrefix: "${{ step.prefix }}" }
        poll: { path: job, query: { id: "${{ response.jobId }}" }, until: "${{ response.status == 'done' }}", fail: "${{ response.status == 'error' }}", every: 3s, timeout: 20m }
        retry: { max: 3, delay: 10s, if: "${{ error.code == 'FFMPEG_BUSY' }}" }
        outputs:
          clip: { type: file, value: "${{ response.result.path }}" }
          wav:  { type: file, value: "${{ response.result.audioPath }}" }
          duration: { type: number, value: "${{ response.result.duration }}" }
      - id: inputs
        name: Scene inputs
        uses: script
        with:
          src: scripts/scene-inputs.js
          scene: ${{ matrix.scene }}
          words: ${{ needs.per-video.outputs.words[matrix.scene.sourceIndex] }}
          scenes: ${{ needs.director.outputs.scenes }}
        outputs:
          word_timings: { type: string }
          previous_context: { type: string }
          scene_words: { type: json }
      - id: refine
        name: Refine the cuts
        uses: pipeline
        with:
          path: refine-scene
          body:
            start: ${{ matrix.scene.start }}
            end: ${{ matrix.scene.end }}
            audio: ${{ steps.cut.outputs.wav.path }}
            sheets: ${{ pluck(needs.sheets.outputs.sheets[matrix.scene.sourceIndex], 'path') }}
            wordTimings: ${{ steps.inputs.outputs.word_timings }}
            brief: ${{ matrix.scene.brief }}
            direction: ${{ inputs.direction }}
            sceneNumber: ${{ matrix.scene.number }}
            sceneCount: ${{ length(needs.director.outputs.scenes) }}
            previousContext: ${{ steps.inputs.outputs.previous_context }}
        poll: { path: job, query: { id: "${{ response.jobId }}" }, until: "${{ response.status == 'done' }}", fail: "${{ response.status == 'error' }}", every: 5s, timeout: 15m }
        outputs:
          cuts: { type: json, value: "${{ response.result.cuts }}" }
          heard_audio: { type: boolean, value: "${{ response.result.heardAudio }}" }
      - id: trim
        name: Trim to the screen
        uses: island
        with:
          src: islands/cut-editor.html
          title: "Trim: ${{ matrix.scene.title }}"
          display: fullscreen
          clip:  ${{ steps.cut.outputs.clip }}
          # The SOURCE's WAV (see `per-video.outputs.wav`) — the editor's transport is
          # on the source's clock. `refine` still takes the clip's wav; `assemble` takes
          # the clip video.
          wav:   ${{ needs.per-video.outputs.wav[matrix.scene.sourceIndex] }}
          scene: ${{ matrix.scene }}
          words: ${{ steps.inputs.outputs.scene_words }}
          cuts:  ${{ steps.refine.outputs.cuts }}
          sheets: ${{ needs.sheets.outputs.sheets[matrix.scene.sourceIndex] }}
          times: ${{ needs.sheets.outputs.times[matrix.scene.sourceIndex] }}
        outputs:
          cuts: { type: json, schema: { type: array, items: { type: object, required: [start, end] } } }
          keep: { type: json, schema: { type: array, items: { type: object, required: [start, end] } } }
        headless: auto
        timeout-minutes: 240
        summary: "Kept ${{ length(steps.trim.outputs.keep) }} spans in *${{ matrix.scene.title }}*."
      - id: assemble
        name: Assemble
        uses: pipeline
        with:
          path: video/slice
          body: { source: "${{ steps.cut.outputs.clip.path }}", spans: "${{ steps.trim.outputs.keep }}", wantAudio: false, audioFades: true, outPrefix: "${{ step.prefix }}" }
        poll: { path: job, query: { id: "${{ response.jobId }}" }, until: "${{ response.status == 'done' }}", fail: "${{ response.status == 'error' }}", every: 3s, timeout: 20m }
        retry: { max: 3, delay: 10s, if: "${{ error.code == 'FFMPEG_BUSY' }}" }
        outputs:
          clip: { type: file, value: "${{ response.result.path }}" }
    outputs:
      clips: ${{ steps.assemble.outputs.clip }}
      keep:  ${{ steps.trim.outputs.keep }}
      words: ${{ steps.inputs.outputs.scene_words }}

  stitch:
    name: Stitch it together
    needs: [per-scene, director]
    steps:
      - id: concat
        uses: pipeline
        with:
          path: video/concat
          body: { clips: "${{ pluck(needs.per-scene.outputs.clips, 'path') }}", outPrefix: "${{ step.prefix }}" }
        poll: { path: job, query: { id: "${{ response.jobId }}" }, until: "${{ response.status == 'done' }}", fail: "${{ response.status == 'error' }}", every: 3s, timeout: 30m }
        outputs:
          short: { type: file, value: "${{ response.result.path }}" }
      - id: script
        name: The final script
        uses: script
        with: { src: scripts/final-script.js, scenes: "${{ needs.director.outputs.scenes }}", keep: "${{ needs.per-scene.outputs.keep }}", words: "${{ needs.per-scene.outputs.words }}" }
        outputs:
          script: { type: string }
          chapters: { type: string }
        summary: |
          ### The short
          ${{ length(needs.per-scene.outputs.clips) }} scenes joined — [download](${{ steps.concat.outputs.short.url }}).
    outputs:
      short:  ${{ steps.concat.outputs.short }}
      script: ${{ steps.script.outputs.script }}
      chapters: ${{ steps.script.outputs.chapters }}

  describe:
    name: Title and description
    needs: [stitch, director]
    steps:
      - id: describe
        uses: pipeline
        with: { path: describe, body: { script: "${{ needs.stitch.outputs.script }}", synopsis: "${{ needs.director.outputs.synopsis }}" } }
        outputs:
          title:   { type: string, value: "${{ response.title }}" }
          summary: { type: string, format: textarea, value: "${{ response.summary }}" }
    outputs:
      title: ${{ steps.describe.outputs.title }}
      summary: ${{ steps.describe.outputs.summary }}

  blog:
    name: Blog post
    needs: [stitch, describe, per-video, director, sheets]
    # An explicit `if` REPLACES the implicit default `success()` (GitHub job-`if` semantics,
    # spec 01 "Control flow & failure") — a failed/skipped `need` is terminal but not success,
    # so this job would still run its turn on a failed `per-video` without the `success() &&`.
    if: ${{ success() && inputs.write_blog }}
    steps:
      - id: write
        uses: pipeline
        with:
          path: blog
          body:
            timed: ${{ needs.per-video.outputs.timed }}
            durations: ${{ needs.per-video.outputs.duration }}
            script: ${{ needs.stitch.outputs.script }}
            title: ${{ needs.describe.outputs.title }}
            summary: ${{ needs.describe.outputs.summary }}
            synopsis: ${{ needs.director.outputs.synopsis }}
            scenes: ${{ needs.director.outputs.scenes }}
            sheets: ${{ pluck(needs.sheets.outputs.sheets, 'path') }}
            direction: ${{ inputs.direction }}
        poll: { path: job, query: { id: "${{ response.jobId }}" }, until: "${{ response.status == 'done' }}", fail: "${{ response.status == 'error' }}", every: 5s, timeout: 15m }
        outputs:
          post: { type: markdown, value: "${{ response.result.markdown }}" }
      # Capture BEFORE the person reviews (apps#429): the review island shows the writer's
      # `frame:<t>` tokens as real images — and offers nearby candidates for each — which
      # only works once the frames exist. The old order (edit a plain markdown form, then
      # capture) showed `(frame:172)` as bare text and left no way to judge or change a frame.
      - id: times
        name: Frames to capture
        uses: script
        with:
          src: scripts/frame-times.js
          markdown: ${{ steps.write.outputs.post }}
          sources: ${{ needs.per-video.outputs.source }}
          durations: ${{ needs.per-video.outputs.duration }}
          # The Change-frame picker's candidates (±30 s around every token). Nobody opens
          # the picker on a headless run — `review` is skipped there — so they are not
          # captured: every candidate is an ffmpeg seek.
          siblings: ${{ !run.headless }}
        outputs:
          captures: { type: json }
      - id: frames
        uses: pipeline
        with:
          path: video/frames
          body: { captures: "${{ steps.times.outputs.captures }}", outPrefix: "${{ step.prefix }}" }
        poll: { path: job, query: { id: "${{ response.jobId }}" }, until: "${{ response.status == 'done' }}", fail: "${{ response.status == 'error' }}", every: 3s, timeout: 10m }
        outputs:
          frames: { type: file, list: true, value: "${{ response.result.paths }}", render: images }
          by_time: { type: json, value: "${{ response.result.byTime }}" }
          dropped: { type: number, value: "${{ response.result.dropped }}" }
        annotations:
          - { level: warning, if: "${{ response.result.dropped > 0 }}", message: "${{ response.result.dropped }} frame capture(s) skipped — the blog frames pipeline handles up to 3 source recordings." }
      - id: review
        name: Review the post
        uses: island
        with:
          src: islands/blog-editor.html
          title: Review the post
          display: fullscreen
          post: ${{ steps.write.outputs.post }}
          # Global token second → the captured frame's path, for the tokens AND the
          # picker's candidates. The island signs what it shows through `workflow.sign`
          # and "Use this frame" just retimes the token to a candidate's second, so
          # `bundle` looks the swapped frame up exactly as it would the original.
          by_time: ${{ steps.frames.outputs.by_time }}
        outputs:
          post: { type: markdown }
        headless: { mode: skip, outputs: { post: "${{ steps.write.outputs.post }}" } }
      - id: bundle
        uses: script
        with: { src: scripts/blog-bundle.js, markdown: "${{ steps.review.outputs.post }}", title: "${{ needs.describe.outputs.title }}", frames: "${{ steps.frames.outputs.frames }}", byTime: "${{ steps.frames.outputs.by_time }}" }
        outputs:
          zip: { type: file }
          post: { type: markdown }
        summary: "Blog bundle **${{ steps.bundle.outputs.zip.name }}** (${{ steps.bundle.outputs.zip.size }} bytes) — [download](${{ steps.bundle.outputs.zip.url }})"
    outputs:
      post: ${{ steps.bundle.outputs.post }}
      zip:  ${{ steps.bundle.outputs.zip }}

  # One render, a person in the loop - Studio's own ThumbnailStudio flow (story 06):
  # notes -> Draft prompt -> the creator EDITS the prompt (and may attach a reference
  # photo) -> ONE nano-banana render. The first live run drew two covers blind and made
  # the person pick (#430); now the person steers the prompt before the paid call and
  # gets exactly one image. Headless: `review` skips with the drafted prompt and no
  # reference, so an unattended run still renders once.
  cover:
    name: Cover
    needs: [describe, stitch]
    if: ${{ success() && inputs.cover }}
    steps:
      - id: brief
        name: Draft the prompt
        uses: pipeline
        with: { path: thumbnail/draft, body: { title: "${{ needs.describe.outputs.title }}", description: "${{ needs.describe.outputs.summary }}", script: "${{ needs.stitch.outputs.script }}", notes: "${{ inputs.cover_direction }}" } }
        outputs:
          prompt: { type: string, format: textarea, value: "${{ response.prompt }}" }
      - id: review
        name: Review the prompt
        uses: form
        with:
          title: Review the cover prompt
          # The draft was written before anyone could attach a photo, so it does not
          # know about one (Studio's "drafted without the reference" hint). The two
          # sentences below are what its system prompt's REFERENCE IMAGE section would
          # have done to it - said here so the person can do it by hand.
          description: >-
            Edit the drafted prompt, then draw the cover - one render. To put yourself
            (or a product) in it, attach a reference photo and tell the prompt to use it:
            name it in the Subject section ("use the attached reference photo of the
            presenter - same face, same person, cut out from its background", where they
            sit and which way they face) and take "photorealistic humans" out of the
            negatives, or the model ignores the photo.
          fields:
            prompt: { type: string, format: textarea, label: Prompt, default: "${{ steps.brief.outputs.prompt }}", required: true }
            reference: { type: file, accept: "image/*", maxSize: 10MB, label: Reference photo (optional) }
          submit: Draw the cover
        # `reference: null` is deliberate: the field is optional, a null File ref is what
        # an unfilled upload submits, and thumbnail/render treats an absent reference as
        # "no image_input". The linter wants every referenced output named here (07).
        headless: { mode: skip, outputs: { prompt: "${{ steps.brief.outputs.prompt }}", reference: null } }
      - id: render
        name: Draw the cover
        uses: pipeline
        # A File ref's `path` is the uploads-relative key the rule confines (R129) and
        # hands nano-banana as `image_input`; `.path` of a null ref is null (01), which
        # the rule reads as "none".
        with: { path: thumbnail/render, body: { prompt: "${{ steps.review.outputs.prompt }}", reference: "${{ steps.review.outputs.reference.path }}", outPrefix: "${{ step.prefix }}" } }
        timeout-minutes: 5
        outputs:
          cover: { type: file, value: "${{ response.path }}" }
        summary: "Cover drawn from the reviewed prompt — [download](${{ steps.render.outputs.cover.url }})"
    outputs:
      prompt: ${{ steps.review.outputs.prompt }}
      cover:  ${{ steps.render.outputs.cover }}

outputs:
  short: ${{ jobs.stitch.outputs.short }}
  title: ${{ jobs.describe.outputs.title }}
  summary: ${{ jobs.describe.outputs.summary }}
  chapters: ${{ jobs.stitch.outputs.chapters }}
  blog:  ${{ jobs.blog.outputs.zip }}
  cover: ${{ jobs.cover.outputs.cover }}
